<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="author" content="Mohamed BARR">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FE5000">
<title>Everpure Certified FlashArray Support Specialist (FASS) – Simulateur d’entraînement</title>
<!-- Seule ressource externe (facultative) : police Google Fonts. Sans connexion, la pile de secours système est utilisée. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Jetons de design (modifiez ici les couleurs de la marque) ============ */
:root{
  --creme:#FEF6E3;           /* fond crème de l'en-tête (couleur du logo) */
  --noir:#1C1C1C;            /* sombre / mode nuit officiel */
  --orange:#FE5000;          /* orange Pure Storage / Everpure */
  --orange-fonce:#D94400;
  --orange-pale:#FFEDE3;
  --encre:#2A2A2A;           /* texte principal */
  --gris:#6B6B6B;            /* texte secondaire */
  --bg:#F4F4F2;              /* arrière-plan du portail */
  --carte:#FFFFFF;
  --trait:#E2E2DE;
  --ok:#1A8F4C; --ok-bg:#E6F6EC;
  --ko:#D32F2F; --ko-bg:#FDECEC;
  --hdr:#FEF6E3; --hdr-trait:#EADFC6; --champ-trait:#9a9a9a;
  --rayon:12px;
  --police:'Figtree','Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
:root[data-theme=dark]{--bg:#121212;--carte:#1C1C1C;--encre:#EDEDED;--gris:#A3A3A3;--trait:#333;--orange-fonce:#FF8A4C;--orange-pale:#3A2113;
  --ok:#3DBE74;--ok-bg:#12301F;--ko:#FF6B6B;--ko-bg:#3A1717;--hdr:#1C1C1C;--hdr-trait:#333;--champ-trait:#777;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--police);background:var(--bg);color:var(--encre);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ============ Arrière-plans officiels Pure Storage (fournis) ============ */
/* Arrière-plan Orange Pure Storage */
.bg-pure-orange { background-color: #FE5000; }
/* Arrière-plan Sombre / Mode Nuit officiel */
.bg-pure-dark { background-color: #1C1C1C; }

/* ============ En-tête ============ */
header{background:var(--hdr);color:var(--encre);border-bottom:1px solid var(--hdr-trait);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.entete{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lien-accueil{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--encre);font-weight:800;font-size:1rem;padding:6px 4px}
.lien-accueil:hover{color:var(--orange)}
.score-live{margin-left:auto;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.barre-globale{height:6px;background:var(--orange)}
.barre-globale div{height:100%;width:0;background:var(--orange);transition:width .4s ease}

.banniere-in{max-width:960px;margin:0 auto;padding:28px 20px 34px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.banniere h1{color:#fff;font-size:clamp(1.7rem,4.4vw,2.6rem);line-height:1.15;margin:0 0 14px}
.banniere p{color:#cfcfcf;margin:0;max-width:44ch;font-size:1.02rem}
.banniere img{width:100%;height:auto;display:block}
.liseré{height:6px}
body.hors-sommaire .banniere,body.hors-sommaire .liseré{display:none}
main{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:28px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:0 0 12px}
.sous-titre{color:var(--gris);margin:0 0 22px;max-width:62ch}

/* ============ Boutons ============ */
.btn{border:1.5px solid var(--encre);background:var(--carte);color:var(--encre);border-radius:8px;padding:11px 20px;font-weight:700;transition:background .15s,color .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--encre);color:var(--carte)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primaire{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primaire:hover:not(:disabled){background:var(--orange-fonce);border-color:var(--orange-fonce)}
.rangee{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ============ Sommaire ============ */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 24px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--gris);font-size:.85rem}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:20px 0 26px}
.pastille{aspect-ratio:1;border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;font-weight:700;color:var(--encre);transition:transform .1s,border-color .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pastille:hover{border-color:var(--orange);transform:translateY(-2px)}
.pastille-num{line-height:1.1}
.tag-exhibit{display:inline-block;font-size:.48rem;line-height:1.1;font-weight:800;letter-spacing:.03em;padding:2px 4px;border-radius:4px;background:var(--orange);color:#fff}
.pastille.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pastille.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.pastille.sel{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-fonce)}
.pastille.courante{box-shadow:0 0 0 3px var(--orange)}
.legende{display:flex;gap:18px;flex-wrap:wrap;color:var(--gris);font-size:.85rem;margin-bottom:6px}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--trait);background:var(--carte)}
.legende i.ok{background:var(--ok-bg);border-color:var(--ok)} .legende i.ko{background:var(--ko-bg);border-color:var(--ko)}

/* ============ Page question ============ */
.haut-q{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.num-q{font-weight:800;color:var(--orange-fonce);font-size:.95rem}
.lien{background:none;border:0;color:var(--gris);font-weight:600;text-decoration:underline;padding:4px}
.lien:hover{color:var(--orange-fonce)}
.mini-barre{height:6px;background:var(--trait);border-radius:99px;overflow:hidden;margin-bottom:22px}
.mini-barre div{height:100%;background:var(--orange);transition:width .3s}
.enonce{font-size:1.2rem;font-weight:600;line-height:1.45;margin:0 0 22px;max-width:70ch}
.options{display:grid;gap:10px;margin:0 0 22px;padding:0;border:0}
.option{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.option:hover{border-color:var(--orange)}
.option input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--champ-trait);border-radius:6px;background:var(--carte);display:grid;place-items:center;cursor:inherit;transition:all .15s}
.option input::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .15s}
.option input:checked{background:var(--orange);border-color:var(--orange)}
.option input:checked::after{transform:rotate(-45deg) scale(1)}
.option.choisie{border-color:var(--orange);background:var(--orange-pale)}
.lettre{font-weight:800;color:var(--gris);min-width:1.1em}
.texte-opt{flex:1;word-break:break-word}
.option.bonne{border-color:var(--ok);background:var(--ok-bg)}
.option.bonne input{background:var(--ok);border-color:var(--ok)}
.option.bonne input::after{transform:rotate(-45deg) scale(1)}
.option.mauvaise{border-color:var(--ko);background:var(--ko-bg)}
.option.mauvaise input{background:var(--ko);border-color:var(--ko)}
.option.verrou{cursor:default}
.badge{font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap;align-self:center}
.option.bonne .badge{background:var(--ok);color:#fff}
.option.mauvaise .badge{background:var(--ko);color:#fff}

/* Feedback animé (technique grid-template-rows 0fr → 1fr) */
.feedback{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s ease,opacity .35s ease,margin .35s}
.feedback.ouvert{grid-template-rows:1fr;opacity:1;margin-bottom:22px}
.feedback>div{overflow:hidden}
.fb-corps{border-radius:10px;padding:18px 20px;border-left:6px solid}
.fb-corps.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb-corps.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb-titre{font-weight:800;font-size:1.1rem;margin:0 0 6px}
.fb-corps.ok .fb-titre{color:var(--ok)} .fb-corps.ko .fb-titre{color:var(--ko)}
.fb-corps p{margin:0 0 6px;max-width:72ch}
.fb-corps .expl-label{font-weight:700;margin-top:8px}

.nav-q{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--trait);padding-top:20px}
.fleche{width:46px;height:46px;padding:0;font-size:1.2rem;display:grid;place-items:center}
.nav-centre{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ============ Résumé ============ */
.bilan{text-align:center;padding:12px 0 8px}
.pourcent{font-size:clamp(3rem,12vw,5rem);font-weight:800;line-height:1;color:var(--orange);letter-spacing:-.03em}
.bilan .detail{font-size:1.15rem;font-weight:600;margin:6px 0 18px}
.grande-barre{height:16px;border-radius:99px;background:var(--trait);overflow:hidden;display:flex;max-width:560px;margin:0 auto 10px}
.grande-barre .v{background:var(--ok);height:100%;transition:width .7s ease}
.grande-barre .r{background:var(--ko);height:100%;transition:width .7s ease}
.repartition{color:var(--gris);font-size:.9rem;margin-bottom:22px}
.revue{margin-top:30px;display:grid;gap:14px}
.revue-item{border:1px solid var(--trait);border-radius:10px;padding:18px;background:var(--carte)}
.revue-item.ok{border-left:6px solid var(--ok)} .revue-item.ko{border-left:6px solid var(--ko)} .revue-item.nr{border-left:6px solid #b5b5b0}
.revue-item h3{font-size:1rem;margin:0 0 12px;line-height:1.4}
.revue-item .options{margin-bottom:10px}
.revue-item .option{cursor:default;padding:10px 14px}
details summary{cursor:pointer;font-weight:700;color:var(--orange-fonce);padding:4px 0}
details p{margin:6px 0 0}

/* ---- Pied de page / copyright ---- */
footer{max-width:960px;margin:0 auto;padding:0 20px 36px;text-align:center;font-size:.82rem;color:var(--gris)}
footer p{margin:0 0 4px}
.copyright{font-weight:600;color:var(--encre)}
/* ---- Boutons d'en-tête ---- */
.icone{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--hdr-trait);background:transparent;color:var(--encre);font-size:1.05rem;display:grid;place-items:center;padding:0}
.icone:hover{border-color:var(--orange);color:var(--orange)}
[hidden]{display:none!important}   /* l'attribut hidden doit l'emporter sur display:grid des boutons ronds */
.score-live{margin-left:auto}
/* ---- Filtres (statut / thème) ---- */
.filtres{display:grid;gap:8px;margin:18px 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips small{color:var(--gris);font-weight:700;min-width:56px}
.recherche-avancee{margin:18px 0 8px;padding:18px;border:1px solid var(--trait);border-radius:12px;background:var(--bg)}
.recherche-avancee h2{margin:0 0 12px;font-size:1.05rem}
.champs-recherche{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.champ-recherche{display:flex;flex-direction:column;gap:5px;min-width:0}
.champ-recherche label{font-size:.82rem;font-weight:700;color:var(--gris)}
.champ-recherche input,.champ-recherche select{width:100%;min-width:0;border:1.5px solid var(--trait);border-radius:8px;padding:10px 11px;background:var(--carte);color:var(--encre);font:inherit}
.champ-recherche.large{grid-column:span 2}
.options-recherche{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.options-recherche label{font-size:.9rem;display:flex;align-items:center;gap:7px}
.options-recherche input{accent-color:var(--orange)}
.resultats-recherche{font-size:.9rem;font-weight:700;color:var(--gris);margin:12px 0 0}
.resultats-avances{display:grid;gap:9px;margin:14px 0 20px}
.resultat-avance{width:100%;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:1px solid var(--trait);border-radius:10px;background:var(--carte);color:var(--encre);padding:13px 15px;transition:border-color .15s,background .15s}
.resultat-avance:hover{border-color:var(--orange);background:var(--orange-pale)}
.resultat-avance .ra-haut{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--gris);font-weight:700}
.resultat-avance .ra-enonce{font-weight:600;line-height:1.4}
@media(max-width:680px){.champs-recherche{grid-template-columns:1fr 1fr}.champ-recherche.large{grid-column:1/-1}}
@media(max-width:420px){.champs-recherche{grid-template-columns:1fr}.champ-recherche.large{grid-column:auto}}
.chip{border:1.5px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:99px;padding:5px 12px;font-size:.84rem;font-weight:600}
.chip:hover{border-color:var(--orange)}
.chip.actif{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.vide{opacity:.45}
.apropos h3{font-size:1.1rem;margin:24px 0 8px}
.modale{position:fixed;inset:0;z-index:2500;background:rgba(10,10,10,.6);display:grid;place-items:center;padding:20px}
.modale-corps{background:var(--carte);color:var(--encre);border-radius:12px;padding:24px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modale-corps p{margin:0 0 18px;white-space:pre-line;font-weight:600}
.apropos p,.apropos li{max-width:72ch}
/* ---- Texte enrichi et exhibits ---- */
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--orange-pale);padding:1px 6px;border-radius:5px;font-size:.9em;word-break:break-word}
.exhibit{margin:0 0 22px;border:1.5px solid var(--trait);border-radius:10px;overflow:hidden;background:var(--carte)}
.exhibit-img{position:relative;display:block;width:100%;border:0;padding:0;background:var(--bg);cursor:zoom-in}
.exhibit-img img{display:block;width:100%;max-height:420px;object-fit:contain}
.loupe{position:absolute;right:10px;bottom:10px;background:rgba(28,28,28,.88);color:#fff;border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700}
/* ---- Zoom plein écran ---- */
.zoom{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2000;background:rgba(10,10,10,.94);display:flex;flex-direction:column}
.zoom-barre{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;color:#fff;flex-wrap:wrap}
.zoom-barre button{background:#2b2b2b;color:#fff;border:1px solid #555;border-radius:8px;min-width:42px;height:40px;font-weight:700;padding:0 12px}
.zoom-barre button:hover{border-color:var(--orange)}
.zoom-barre span{min-width:60px;text-align:center;font-weight:700}
.zoom-scene{flex:1;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.zoom-scene:active{cursor:grabbing}
.zoom-scene img{max-width:96%;max-height:96%;transform-origin:center;background:#fff;-webkit-user-drag:none}
/* ---- Protection anti-reproduction (voir PROTECTION dans le script) ---- */
body.anti-copie{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.anti-copie input{-webkit-user-select:auto;user-select:auto}
#rapport{display:none}
button.option{width:100%;text-align:left;color:var(--encre)}
@media print{
  body.export-pdf>*:not(#rapport){display:none!important}
  body.export-pdf #rapport{display:block;color:#000;background:#fff;font:13px/1.45 Arial,sans-serif;padding:8mm}
  #rapport h1{font-size:20px;color:#FE5000;margin:0 0 6px} #rapport h2{font-size:15px;margin:16px 0 6px}
  #rapport table{width:100%;border-collapse:collapse} #rapport th,#rapport td{border:1px solid #bbb;padding:4px 8px;text-align:left}
  #rapport .rq{break-inside:avoid;border-left:4px solid #FE5000;padding-left:8px;margin:0 0 8px}
  body.sans-impression:not(.export-pdf)>*{display:none!important}
  body.sans-impression:not(.export-pdf)::before{content:"Impression désactivée – © Mohamed BARR";display:block;font:700 20px Arial,sans-serif;padding:40px}
}
/* ---- Marquage (drapeau) ---- */
.btn.drapeau{padding:7px 14px;font-size:.88rem;border-width:1.5px}
.btn.drapeau.actif{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-fonce)}
.btn.drapeau.actif:hover:not(:disabled){background:var(--orange);color:#fff}
.pastille{position:relative}
.pastille.marque::after{content:"";position:absolute;top:-1.5px;right:-1.5px;border:9px solid transparent;border-top-color:var(--orange);border-right-color:var(--orange);border-top-right-radius:10px}
.legende i.flag{background:var(--orange);border-color:var(--orange)}
/* ---- Mode examen ---- */
.panneau-examen{border:1.5px solid var(--trait);border-left:8px solid var(--orange);border-radius:10px;padding:16px 20px;margin:0 0 26px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panneau-examen strong{display:block;font-size:1.05rem}
.panneau-examen span{color:var(--gris);font-size:.92rem}
.regles{margin:0 0 24px;padding-left:20px;max-width:68ch}
.regles li{margin-bottom:8px}
.score-live.attention{background:#B26A00}
.score-live.urgence{background:var(--ko)}
.verdict{display:inline-block;padding:6px 20px;border-radius:99px;font-weight:800;color:#fff;margin-bottom:14px}
.verdict.ok{background:var(--ok)} .verdict.ko{background:var(--ko)}
.avis{background:var(--orange-pale);border-radius:8px;padding:10px 14px;margin:0 auto 16px;max-width:560px;font-weight:600}
@media (max-width:720px){
  .banniere-in{grid-template-columns:1fr;padding:22px 20px 26px}
  .banniere img{order:-1;max-width:420px;margin:0 auto}
}
@media (max-width:600px){
  .carte{padding:18px}
  .nav-q{flex-direction:column-reverse;align-items:stretch}
  .nav-centre{justify-content:space-between}
  .nav-centre .btn.primaire{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ============ Mode lecture : confort visuel (police légèrement réduite, interligne aéré, fond « papier », lignes courtes) ============ */
html{font-size:93.75%}                                   /* 15 px au lieu de 16 px */
html[data-taille=grand]{font-size:106.25%}
html[data-taille=petit]{font-size:87.5%}
:root{--bg:#F3F1EB;--carte:#FFFEFA;--encre:#33322E}
body{line-height:1.65;letter-spacing:.005em}
.enonce{font-size:1.12rem;line-height:1.6}
.texte-opt{line-height:1.55}
.option{padding:13px 16px}
.fb-corps p,.revue-item details p{line-height:1.7;max-width:66ch}
.fb-corps ul,.revue-item details ul,.apropos ul,.apropos ol{line-height:1.7;max-width:66ch}
.apropos ol{padding-left:1.5em}.apropos ol li{margin-bottom:8px}
.apropos p,.apropos li{line-height:1.7;max-width:66ch}
.revue-item h3{line-height:1.5}
.icone[id=btnTaille]{font-size:.8rem;font-weight:800}
/* ============ En-tête : accueil agrandi, bouton central, groupe d'icônes ============ */
.entete{justify-content:space-between}
.lien-accueil{font-size:1.4rem;gap:12px}
.lien-accueil img{width:42px;height:auto}
.cta-entete{display:none;padding:9px 22px;white-space:nowrap}
.droite{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.droite .score-live{margin-left:0}
@media (max-width:720px){
  .cta-entete{order:5;flex:1 1 100%}
  .entete{padding:8px 14px;gap:8px 10px}
  .droite{gap:6px;margin-left:auto}
  .icone{width:32px;height:32px;font-size:.95rem}
  .droite .score-live{padding:5px 11px;font-size:.82rem}
  .lien-accueil .txt-accueil{display:none}      /* mobile : icône seule */
  .lien-accueil{padding:2px}
  .lien-accueil img{width:32px}
  .droite{flex-wrap:nowrap}                    /* tout reste sur une seule ligne */
  body.sur-accueil header{position:static}      /* page 1 : en-tête non collant sur mobile (gain de place) */
}
/* ============ Profil du candidat, félicitations ============ */
.champ{display:grid;gap:4px;margin:0 0 12px}
.champ span{font-size:.85rem;font-weight:700;color:var(--gris)}
.champ input{font:inherit;padding:10px 12px;border:1.5px solid var(--trait);border-radius:8px;background:var(--carte);color:var(--encre)}
.champ input:focus{border-color:var(--orange);outline:none}
.modale-corps h3{margin:0 0 6px}
.modale-corps p.note{font-weight:400;font-size:.88rem;color:var(--gris);margin-bottom:16px}
.profil-carte{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hdr);border:0;border-left:4px solid var(--orange);border-radius:10px;padding:12px 16px;margin:16px 0 4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.felic{font-weight:700;color:var(--ok);margin:0 0 14px}

/* Examen : navigation Précédent / Suivant, bouton « Revue » distinct */
.nav-exam{display:flex;gap:12px;margin-top:22px}
.nav-exam .btn{flex:1;min-height:48px}
.revue-sep{margin-top:18px;padding-top:18px;border-top:1px solid var(--trait)}
.btn-revue{width:100%;min-height:46px;background:var(--encre);color:var(--carte);border-color:var(--encre)}
.btn-revue:hover:not(:disabled){opacity:.88}

/* Domaines couverts : grille de 2 colonnes, pastille numérotée */
.domaines{display:grid;grid-template-columns:1fr 1fr;gap:22px 34px;margin:14px 0 6px}
.dom{display:flex;gap:14px;align-items:flex-start}
.dom p{margin:0;max-width:none;line-height:1.6}
.dom-num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;background:rgba(254,80,0,.13);color:var(--orange-fonce,#C23D00)}
@media (max-width:720px){.domaines{grid-template-columns:1fr;gap:16px}}

/* ============ Accueil : plateforme d'entraînement FASS ============ */
.banniere-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.banniere-cta .btn{background:transparent;border-color:#fff;color:#fff}
.banniere-cta .btn:hover:not(:disabled){background:#fff;color:var(--noir)}
.banniere-cta .btn.primaire{background:var(--orange);border-color:var(--orange)}
.banniere-cta .btn.primaire:hover:not(:disabled){background:var(--orange-fonce);border-color:var(--orange-fonce);color:#fff}
.accueil{display:grid;gap:22px}
.faits{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.faits .tuile b{font-size:1.3rem}
.tuile{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:14px 16px}
.tuile b{display:block;font-size:1.45rem;line-height:1.2;color:var(--orange-fonce);overflow-wrap:break-word}
.tuile span{display:block;color:var(--gris);font-size:.82rem;line-height:1.35;margin-top:2px}
.note-faits,.note-prog{color:var(--gris);font-size:.82rem;margin:10px 2px 0}
.parcours-grille{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.parcours{background:var(--carte);border:1px solid var(--trait);border-top:6px solid var(--orange);border-radius:var(--rayon);padding:24px;display:flex;flex-direction:column;gap:14px}
.parcours.exam{border-top-color:var(--encre)}
.parcours h2{margin:0 0 2px;font-size:1.3rem}
.p-tete{display:flex;gap:14px;align-items:flex-start}
.p-ico{font-size:1.7rem;line-height:1}
.p-sous{margin:0;color:var(--gris)}
.p-liste{margin:0;padding-left:1.15em}.p-liste li{margin-bottom:4px}
.p-prog small{display:block;color:var(--gris);margin-top:2px}
.p-etat{margin:0;font-weight:700;background:var(--orange-pale);border-radius:8px;padding:10px 14px}
.p-actions{margin-top:auto}
.onglets{display:inline-flex;flex-wrap:wrap;background:var(--bg);border:1px solid var(--trait);border-radius:999px;padding:4px;margin:4px 0 18px}
.onglet{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:700;color:var(--gris)}
.onglet:hover{color:var(--encre)}
.onglet.actif{background:var(--orange);color:#fff}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.lignes-themes{display:grid;grid-template-columns:1fr 1fr;gap:18px 34px}
.lt-haut{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.lt-pct{font-weight:800;color:var(--orange-fonce);white-space:nowrap;flex:none}
.mini-barre.fin{height:8px;margin:6px 0 6px}
.lt-bas{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--gris);font-size:.85rem}
.lt-bas .lien{font-size:.85rem;padding:0}
.vide-prog{color:var(--gris);background:var(--bg);border:1px dashed var(--hdr-trait);border-radius:10px;padding:18px;margin:0}
.res-themes{max-width:640px;margin:22px auto 24px;text-align:left}
.res-themes h2{text-align:center}

/* ============ Question : thème, progression de session, options en cartes ============ */
.q-entete{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chip-theme{background:var(--orange-pale);color:var(--orange-fonce);font-weight:700;font-size:.82rem;border-radius:999px;padding:4px 12px}
.chip-theme.chip-exam{background:var(--noir);color:#fff}
.q-prog{display:flex;justify-content:space-between;align-items:center;gap:6px 16px;flex-wrap:wrap;margin-bottom:8px}
.q-prog .num-q{font-size:1rem}
.q-session{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--gris)}
.q-session b{color:var(--encre)}
.q-session .ok{color:var(--ok);font-weight:700}.q-session .ko{color:var(--ko);font-weight:700}
.option{position:relative;align-items:center;gap:14px}
.option input{position:absolute;opacity:0;width:1px;height:1px;margin:0;border:0;pointer-events:none}
.lettre{flex:none;display:grid;place-items:center;width:32px;height:32px;min-width:32px;border-radius:50%;background:var(--bg);border:1.5px solid var(--trait);color:var(--encre);font-weight:800;transition:all .15s}
.option:hover .lettre{border-color:var(--orange);color:var(--orange-fonce)}
.option.choisie .lettre{background:var(--orange);border-color:var(--orange);color:#fff}
.option.bonne .lettre{background:var(--ok);border-color:var(--ok);color:#fff}
.option.mauvaise .lettre{background:var(--ko);border-color:var(--ko);color:#fff}
.option:has(input:focus-visible){outline:3px solid var(--orange);outline-offset:2px}
.nav-train{border-top:1px solid var(--trait);padding-top:20px}
.nav-train .btn-verifier{width:100%;min-height:48px;margin-bottom:12px}
.nav-train .nav-exam{margin-top:0}
@media (max-width:720px){.parcours-grille,.lignes-themes{grid-template-columns:1fr}.parcours{padding:18px}}
@media (max-width:720px){.faits{grid-template-columns:1fr 1fr}.faits .tuile b{font-size:1.1rem}.faits .tuile:last-child:nth-child(odd){grid-column:1/-1}}
</style>
</head>

/* ============================================================

const QUESTIONS = [{"n":1,"q":"A host reports high I/O latency, but array-side service latency remains low. Where should troubleshooting focus first?","o":{"A":"Increase snapshot retention","B":"Replace the array controllers immediately","C":"Host, fabric, and pathing layers","D":"Recreate every volume"},"a":"C","e":[["p","Une faible contribution de la latence de service de la baie oriente d’abord le diagnostic vers l’hôte, la fabric SAN, le multipathing ou les files d’attente, plutôt que vers la baie elle-même."]],"t":"Performance"},{"n":2,"q":"A driver-stall record shows a long interval in the host-side stages before the command is issued to the array. What should support correlate first?","o":{"A":"Snapshot retention and naming policies","B":"Host driver/HBA logs and the timestamped SAN path events","C":"Shelf IDs on the array, regardless of related alerts","D":"DNS search suffixes, even for block I/O"},"a":"B","e":[["p","Un long délai dans les étapes côté hôte avant l’émission de la commande oriente d’abord vers les journaux du pilote, de la HBA et les événements de la fabric SAN. Il faut corréler les horodatages avant d’attribuer le délai à la baie."]],"t":"Performance"},{"n":3,"q":"Several hosts on the same Fibre Channel edge switch show intermittent latency. What is the strongest initial hypothesis?","o":{"A":"A separate filesystem corruption on every host","B":"A certificate rotation failure","C":"A CloudSnap baseline issue","D":"A shared fabric issue, such as congestion or slow-drain behavior"},"a":"D","e":[["p","Lorsqu’il touche plusieurs hôtes sur le même segment de fabric, un composant réseau partagé constitue une cause commune probable."]],"t":"Performance"},{"n":4,"q":"Only one host is slow while other hosts using the same array remain healthy. What should be compared first?","o":{"A":"The array’s global data-reduction ratio only","B":"The remote array’s shelf IDs","C":"The mediator’s ICMP response","D":"That host’s HBA, multipath state, driver, and workload"},"a":"D","e":[["p","Si le symptôme ne concerne qu’un seul hôte, le problème est probablement local à cet hôte. Comparez les chemins, les versions de pilotes, la profondeur de file et la charge de travail."]],"t":"Performance"},{"n":5,"q":"A workload’s throughput rises but its I/O latency also rises sharply. Which explanation is plausible?","o":{"A":"The DNS server is serving stale records","B":"The array has silently changed its RAID level","C":"The workload or a shared resource may be approaching saturation","D":"Higher throughput proves there is no contention"},"a":"C","e":[["p","Lorsque la charge augmente, les files d’attente et les ressources partagées peuvent saturer. Corrélez la latence, les IOPS, le débit et l’utilisation des ressources."]],"t":"Performance"},{"n":6,"q":"Which metric combination is most useful when characterizing a performance complaint?","o":{"A":"Only the total number of snapshots","B":"Only the array serial number","C":"Latency, IOPS, throughput, and read/write mix over the same time window","D":"Only the volume name and creation date"},"a":"C","e":[["p","Le diagnostic des performances nécessite des mesures cohérentes de la charge et de la latence, et non une seule métrique isolée."]],"t":"Performance"},{"n":7,"q":"A single host generates unusually high I/O and affects other tenants. What should be investigated?","o":{"A":"Noisy-neighbor behavior and workload-level QoS","B":"The shelf ID format","C":"The array’s timezone","D":"The administrator’s display theme"},"a":"A","e":[["p","Un hôte très demandeur peut consommer des ressources partagées. Analysez la répartition de la charge et les contrôles QoS disponibles."]],"t":"Performance"},{"n":8,"q":"What is the primary purpose of a QoS limit on a host group or workload?","o":{"A":"To cap the workload’s IOPS and/or bandwidth where supported","B":"To increase physical capacity automatically","C":"To repair a failed SFP","D":"To change synchronous replication into asynchronous replication"},"a":"A","e":[["p","Les limites QoS peuvent réguler le débit d’une charge de travail et réduire les interférences. Les contrôles exacts dépendent de la version de Purity et du type d’objet."]],"t":"Performance"},{"n":9,"q":"A workload reaches its configured bandwidth cap. What outcome should you expect?","o":{"A":"Throughput may be constrained by the configured limit","B":"The array starts a controller failover","C":"The volume becomes read-only permanently","D":"The replication mediator is promoted"},"a":"A","e":[["p","Une limite de débit sert à plafonner le débit d’une charge de travail. Vérifiez sa portée et la configuration actuellement appliquée."]],"t":"Performance"},{"n":10,"q":"Which is the safest way to investigate a suspected QoS issue?","o":{"A":"Disable multipathing on every host","B":"Delete and recreate the host group immediately","C":"Inspect the effective policy and compare observed I/O with its limits","D":"Change the array’s management IP"},"a":"C","e":[["p","Avant de modifier la configuration, vérifiez l’association de la règle et les débits réellement observés."]],"t":"Performance"},{"n":11,"q":"What does a ‘slow drain’ condition generally describe in a Fibre Channel fabric?","o":{"A":"A delayed certificate renewal","B":"A scheduled array software upgrade","C":"A volume with no snapshots","D":"A device or path that cannot consume frames quickly enough, causing fabric congestion"},"a":"D","e":[["p","Un comportement de type *slow drain* peut provoquer de la congestion et affecter d’autres flux. Examinez les compteurs de la fabric côté commutateur et côté hôte."]],"t":"Performance"},{"n":12,"q":"A CTIO timeout alert appears alongside evidence of FC congestion. What should be investigated?","o":{"A":"The local DNS cache","B":"Only the array’s data-reduction ratio","C":"FC fabric health, slow-drain indicators, and affected paths","D":"Only the SMB share permissions"},"a":"C","e":[["p","Corrélez les symptômes CTIO avec l’état de la fabric et les chemins hôtes, au lieu de traiter l’alerte isolément."]],"t":"Performance"},{"n":13,"q":"An array-level system-space metric is high while the host filesystem reports free capacity. What should you conclude?","o":{"A":"The two metrics describe different layers and must be investigated separately","B":"Host filesystem free space directly determines array system space","C":"System space is always equal to the number of snapshots","D":"The array has no internal metadata"},"a":"A","e":[["p","L’espace système est une métrique rapportée au niveau de la baie ; l’espace libre du système de fichiers est mesuré côté hôte. Leur différence n’est pas, à elle seule, une contradiction ni une preuve de panne."]],"t":"Performance"},{"n":14,"q":"Which observation is most relevant when diagnosing excessive pinned space?","o":{"A":"The DNS TTL for the array name","B":"The host’s keyboard layout","C":"The amount of data that cannot currently be reclaimed and the features retaining it","D":"The number of administrators logged into Pure1"},"a":"C","e":[["p","L’espace épinglé (*pinned space*) correspond aux données qui ne peuvent pas être récupérées. Selon les recommandations en vigueur, examinez les snapshots, la protection et les règles de rétention propres aux fonctionnalités utilisées."]],"t":"Performance"},{"n":15,"q":"Why should performance graphs use the same time range for host and array metrics?","o":{"A":"Because array metrics are only valid at midnight","B":"To correlate symptoms and avoid comparing unrelated periods","C":"To force all I/O to become sequential","D":"To make the graph use fewer colors"},"a":"B","e":[["p","Des fenêtres de mesure alignées permettent de corréler les symptômes côté hôte avec le comportement de la baie et de la fabric."]],"t":"Performance"},{"n":16,"q":"A latency spike occurs only during backup windows. What should be compared?","o":{"A":"Only the date the host was installed","B":"Only the volume’s serial number","C":"Backup I/O profile, competing workloads, and array/fabric metrics during that window","D":"Only the array’s model name"},"a":"C","e":[["p","La corrélation temporelle peut révéler une contention de charge ou une pression sur la fabric associée à la sauvegarde."]],"t":"Performance"},{"n":17,"q":"What does IOPS measure?","o":{"A":"The round-trip time between replication sites","B":"The number of controller failovers per day","C":"The amount of data stored after compression","D":"The number of I/O operations completed per second"},"a":"D","e":[["p","Les IOPS représentent un taux d’opérations. Analysez-les avec la taille des blocs, le débit et la latence."]],"t":"Performance"},{"n":18,"q":"What does throughput measure in a storage performance context?","o":{"A":"The count of snapshots retained","B":"The amount of data transferred per unit time","C":"The number of FC zones","D":"The number of host objects configured"},"a":"B","e":[["p","Le débit est généralement exprimé en MB/s ou GB/s et doit être interprété avec la taille des E/S et la latence."]],"t":"Performance"},{"n":19,"q":"Why can two workloads with the same IOPS have different throughput?","o":{"A":"Their volume names are different","B":"Their average I/O sizes may differ","C":"One must use ActiveCluster","D":"They have different DNS suffixes"},"a":"B","e":[["p","Le débit dépend à la fois du nombre d’opérations par seconde et de la taille des E/S."]],"t":"Performance"},{"n":20,"q":"A workload’s IOPS is low but latency is high. Which conclusion is safest?","o":{"A":"The replication target is definitely offline","B":"Low IOPS alone does not rule out a path, queueing, or workload latency problem","C":"The array is definitely healthy","D":"The volume must be thick provisioned"},"a":"B","e":[["p","Un faible taux d’opérations ne prouve pas que la latence est faible. Examinez les chemins, les files d’attente, la charge et les horaires."]],"t":"Performance"},{"n":21,"q":"Why is it useful to separate read and write behavior during performance analysis?","o":{"A":"The array supports only one operation type at a time","B":"Writes do not affect latency","C":"Reads always use the mediator","D":"Read and write patterns can stress different paths and services"},"a":"D","e":[["p","La répartition lecture/écriture influence le cache, le travail côté backend et les interactions avec la réplication. Appuyez-vous sur des données propres à la charge observée."]],"t":"Performance"},{"n":22,"q":"A customer reports poor application response but storage latency appears normal. What should the support specialist do?","o":{"A":"Increase the array’s physical capacity regardless of utilization","B":"Replace flash modules immediately","C":"Check the application, host, network, and timing correlation before attributing it to storage","D":"Disable all snapshots"},"a":"C","e":[["p","Le temps de réponse d’une application comprend davantage que la latence du stockage. Isolez le délai mesuré avant de modifier la baie."]],"t":"Performance"},{"n":23,"q":"What is the main risk of interpreting a single performance snapshot without history?","o":{"A":"It disables support telemetry","B":"It always causes the array to reboot","C":"It changes the array’s data reduction","D":"It may miss transient spikes, periodic contention, or workload changes"},"a":"D","e":[["p","Il faut examiner l’historique des mesures pour déterminer si le problème est ponctuel, récurrent ou lié à la charge."]],"t":"Performance"},{"n":24,"q":"Which action is best before changing a performance setting?","o":{"A":"Change both host and array settings simultaneously without measurement","B":"Delete logs to reduce noise","C":"Make several unrelated changes at once","D":"Capture the current state, establish a baseline, and define a rollback plan"},"a":"D","e":[["p","Une référence de départ et des changements contrôlés aident à établir la causalité et permettent un retour arrière."]],"t":"Performance"},{"n":25,"q":"Before enabling an OpenMetrics exporter for monitoring, which practice is most appropriate?","o":{"A":"Confirm supported metrics and version, restrict access to the endpoint, and validate the scrape configuration","B":"Expose the management endpoint publicly for easier collection","C":"Assume every metric is enabled by default on every release","D":"Disable native array alerts because the exporter replaces them"},"a":"A","e":[["p","La collecte doit être compatible avec la version déployée et configurée de façon sécurisée. Vérifiez les métriques prises en charge, les droits d’accès et le paramétrage du collecteur ; ne remplacez pas les alertes natives sans procédure documentée."]],"t":"Performance"},{"n":26,"q":"A chart shows high utilization but no latency complaint. What should you conclude?","o":{"A":"Utilization is a signal to contextualize, not proof of a performance incident","B":"The array must be rebooted","C":"High utilization always means hardware failure","D":"All volumes are corrupted"},"a":"A","e":[["p","Interprétez l’utilisation des ressources avec la latence, le débit, le comportement de la charge et les alertes de service."]],"t":"Performance"},{"n":27,"q":"What is a useful first step when an issue affects multiple workloads at once?","o":{"A":"Delete all replication schedules","B":"Treat every volume as an independent failure","C":"Change each volume’s name","D":"Look for a shared bottleneck or common event across host, fabric, and array"},"a":"D","e":[["p","Des symptômes partagés indiquent souvent un composant commun, un événement ou un point de contention."]],"t":"Performance"},{"n":28,"q":"A host path has failed and multipathing is operating on fewer paths. What should be checked?","o":{"A":"The Pure Fusion fleet name","B":"Only the SMB share name","C":"Path status, failover behavior, and whether remaining paths are healthy and balanced","D":"Only the array’s snapshot retention"},"a":"C","e":[["p","Une redondance réduite des chemins peut affecter la résilience et le débit. Vérifiez l’état des chemins et la politique de multipathing de l’hôte."]],"t":"Performance"},{"n":29,"q":"Why is queue depth relevant in host performance troubleshooting?","o":{"A":"It influences how many I/Os can be outstanding and may affect latency under load","B":"It determines array encryption strength","C":"It changes FC WWNs","D":"It sets the replication RPO"},"a":"A","e":[["p","La profondeur de file et les paramètres du pilote hôte peuvent influencer le parallélisme de la charge et la latence. N’ajustez ces paramètres qu’en suivant les recommandations du fournisseur."]],"t":"Performance"},{"n":30,"q":"What should be done when a suspected performance issue begins immediately after a change?","o":{"A":"Assume coincidence and make another change","B":"Correlate the change timestamp with host, fabric, array, and workload metrics","C":"Disable every alert","D":"Purge the array logs"},"a":"B","e":[["p","La corrélation temporelle permet de vérifier si le changement est une cause plausible de la dégradation."]],"t":"Performance"},{"n":31,"q":"A large sequential workload has high throughput and moderate IOPS. Is that inherently a fault?","o":{"A":"No; the pattern may be consistent with large I/O sizes","B":"Yes; healthy storage must always have maximum IOPS","C":"No; because throughput is not measurable","D":"Yes; it proves a failed controller"},"a":"A","e":[["p","Des E/S de grande taille peuvent produire un débit élevé sans IOPS extrêmes. Évaluez les résultats par rapport aux objectifs de la charge."]],"t":"Performance"},{"n":32,"q":"Which statement about latency is most accurate?","o":{"A":"Latency is another name for capacity","B":"Latency is determined only by snapshot count","C":"End-to-end latency can include host, fabric, array, and application contributions","D":"Array service latency always equals application latency"},"a":"C","e":[["p","Mesurez les couches pertinentes et ne confondez pas une seule métrique de latence avec l’expérience globale de l’application."]],"t":"Performance"},{"n":33,"q":"Which CLI command is a reasonable starting point for an array-level summary, rather than a detailed hardware inventory or a volume listing?","o":{"A":"`puresnap eradicate`","B":"`pureport list --initiator`","C":"`purearray list`","D":"`purevol list`"},"a":"C","e":[["p","`purearray list` est une commande de synthèse au niveau de la baie. Elle ne remplace pas les contrôles détaillés de matériel, d’alertes ou de performances ; utilisez les commandes adaptées au symptôme."]],"t":"Software"},{"n":34,"q":"Which command is intended to inventory physical hardware components?","o":{"A":"`purehgroup list`","B":"`purevol list`","C":"`pureprotectiongroup list`","D":"`purehw list`"},"a":"D","e":[["p","Dans les exemples publics d’entraînement, `purehw list` est la commande générale d’inventaire matériel."]],"t":"Software"},{"n":35,"q":"What is the role of the Purity//FA operating environment?","o":{"A":"To manage only external DNS zones","B":"To replace the host operating system","C":"To provide only a mobile notification app","D":"To manage FlashArray storage, hardware integration, and data services"},"a":"D","e":[["p","Purity est l’environnement d’exploitation de la baie. Il coordonne les fonctions de stockage et les services pris en charge."]],"t":"Software"},{"n":36,"q":"Which statement best describes thin provisioning?","o":{"A":"Logical capacity can be presented without immediately reserving all corresponding physical capacity","B":"It disables data reduction","C":"Every logical block is always physically allocated at creation","D":"It converts all volumes to file shares"},"a":"A","e":[["p","Le thin provisioning distingue la capacité logique présentée de l’allocation physique immédiate."]],"t":"Software"},{"n":37,"q":"What does Data Reduction Ratio (DRR) represent in FlashArray capacity reporting?","o":{"A":"The ratio of controllers to shelves","B":"Replication-link utilization","C":"Data reduction from mechanisms such as deduplication and compression, excluding thin-provisioning savings","D":"All capacity savings, including every thin-provisioning effect"},"a":"C","e":[["p","Le DRR décrit la réduction due aux mécanismes de réduction des données, tels que la déduplication et la compression. Il ne doit pas être confondu avec Total Reduction, qui inclut également les effets du thin provisioning."]],"t":"Software"},{"n":38,"q":"In FlashArray capacity reporting, how does Total Reduction differ from DRR?","o":{"A":"Total Reduction excludes compression","B":"Total Reduction includes thin-provisioning effects in addition to data reduction","C":"The two values are guaranteed to be identical","D":"DRR always includes every possible capacity saving"},"a":"B","e":[["p","Total Reduction tient compte de la réduction des données et des économies liées au thin provisioning. Le DRR, lui, exclut les économies liées au thin provisioning."]],"t":"Software"},{"n":39,"q":"What is the purpose of a snapshot?","o":{"A":"To preserve a point-in-time view of data according to the array’s snapshot model","B":"To change the host’s DNS resolver","C":"To replace all backups in every recovery design","D":"To create a new physical controller"},"a":"A","e":[["p","Les snapshots permettent une récupération à un instant donné, mais ne remplacent pas automatiquement une stratégie complète de sauvegarde."]],"t":"Software"},{"n":40,"q":"What is the main purpose of SafeMode in supported configurations?","o":{"A":"To disable all administrative access","B":"To increase FC link speed","C":"To automatically repair every host filesystem","D":"To protect designated snapshots from unauthorized or premature eradication"},"a":"D","e":[["p","SafeMode est une fonctionnalité de protection des snapshots. Sa configuration et les procédures d’effacement définitif doivent respecter les processus pris en charge."]],"t":"Software"},{"n":41,"q":"Before a Purity//FA upgrade, which readiness check is the safest?","o":{"A":"Disable monitoring so alerts cannot appear","B":"Remove all host mappings","C":"Check the supported upgrade path, release notes, array health, compatibility requirements, and documented pre-flight procedure","D":"Start the upgrade immediately, regardless of array health"},"a":"C","e":[["p","La préparation doit suivre le chemin de mise à niveau pris en charge et les prérequis propres à la version cible. Vérifiez l’état de santé, la compatibilité et la procédure officielle de précontrôle avant de commencer."]],"t":"Software"},{"n":42,"q":"Why should an operator capture the current software version before troubleshooting?","o":{"A":"The version determines the host’s MAC address","B":"Commands, features, and expected behavior may differ by release","C":"The version replaces the need for logs","D":"The version proves the storage fabric is healthy"},"a":"B","e":[["p","Le contexte de version est essentiel, car le guide d’examen couvre des versions précises de Purity ainsi que des comportements plus anciens qui restent applicables."]],"t":"Software"},{"n":43,"q":"What does role-based access control (RBAC) primarily provide?","o":{"A":"Automatic data reduction","B":"A replacement for authentication","C":"Automatic replication between arrays","D":"Different permissions for users according to assigned roles"},"a":"D","e":[["p","Le contrôle d’accès basé sur les rôles (RBAC) limite les actions selon le rôle. Choisissez le rôle disposant des privilèges minimaux nécessaires à la tâche."]],"t":"Software"},{"n":44,"q":"A task requires a capability not granted to the current role. What should the administrator do?","o":{"A":"Request the appropriate authorized role or escalation","B":"Edit internal configuration files directly","C":"Disable authentication","D":"Share another administrator’s credentials"},"a":"A","e":[["p","Utilisez les procédures approuvées d’accès et d’escalade plutôt que de contourner les autorisations."]],"t":"Software"},{"n":45,"q":"What is a host object generally used for on FlashArray?","o":{"A":"To store array firmware images","B":"To represent a host and its connectivity/initiator information for volume access","C":"To name a physical shelf","D":"To represent a replication mediator"},"a":"B","e":[["p","Les objets hôtes représentent la connectivité des hôtes et aident à associer les volumes aux bons initiateurs."]],"t":"Software"},{"n":46,"q":"What is a host group generally used for?","o":{"A":"To group controllers into a chassis","B":"To group hosts that share volume access or common configuration","C":"To create a DNS domain","D":"To define the array’s physical RAID level"},"a":"B","e":[["p","Les groupes d’hôtes simplifient la configuration des accès partagés pour les hôtes qui doivent accéder aux mêmes volumes."]],"t":"Software"},{"n":47,"q":"Why should volume mappings be checked when a host cannot see a LUN?","o":{"A":"Mappings determine the array’s encryption algorithm","B":"The volume must be connected to the correct host or host group and the host path must be healthy","C":"Mappings automatically fix SAN zoning","D":"Mappings control only email alerts"},"a":"B","e":[["p","La visibilité dépend à la fois du mappage côté baie et de la configuration de l’hôte et de la fabric."]],"t":"Software"},{"n":48,"q":"What is the purpose of a protection group?","o":{"A":"To replace all host groups","B":"To apply protection and replication policy to a set of volumes","C":"To set Ethernet MTU","D":"To elect the ActiveCluster mediator"},"a":"B","e":[["p","Les groupes de protection organisent les volumes pour les workflows de snapshots et de réplication, selon la configuration."]],"t":"Software"},{"n":49,"q":"What is the purpose of a scheduled snapshot policy?","o":{"A":"To configure DNS forwarders","B":"To change the controller master","C":"To automate snapshot creation according to a defined schedule and retention policy","D":"To rotate FC SFPs"},"a":"C","e":[["p","Les planifications automatisent la création des snapshots. Vérifiez les exigences de rétention et de récupération avant de les modifier."]],"t":"Software"},{"n":50,"q":"What should be reviewed before deleting a volume?","o":{"A":"Only the number of logged-in administrators","B":"Only the volume’s display name","C":"Only the current time zone","D":"Host mappings, dependencies, protection/replication relationships, and data-retention requirements"},"a":"D","e":[["p","Une suppression peut affecter les applications et les possibilités de récupération. Vérifiez d’abord les dépendances et les approbations."]],"t":"Software"},{"n":51,"q":"What does a volume’s logical size represent?","o":{"A":"The capacity presented to the host, not necessarily the physical capacity currently consumed","B":"The amount of array RAM","C":"The exact number of physical flash modules","D":"The size of the management database only"},"a":"A","e":[["p","La capacité logique provisionnée et la consommation physique sont deux mesures distinctes."]],"t":"Software"},{"n":52,"q":"Which statement about FlashArray File Services is the most accurate for support troubleshooting?","o":{"A":"File services are available on every model and every Purity release without qualification","B":"Availability and supported protocols depend on the supported model and software configuration; check the applicable compatibility guide","C":"File services automatically replace all block volumes","D":"Every FlashArray File deployment requires a separate FlashBlade"},"a":"B","e":[["p","FA File est disponible dans les configurations FlashArray prises en charge ; il ne faut ni généraliser à tous les modèles et versions, ni affirmer qu’un FlashBlade séparé est toujours requis. Vérifiez la matrice de compatibilité applicable."]],"t":"Software"},{"n":53,"q":"What is the purpose of a Pure Fusion fleet coordinator?","o":{"A":"To act as an FC switch","B":"To coordinate fleet-level management functions for supported arrays and services","C":"To provide the host’s multipath driver","D":"To replace all array controllers"},"a":"B","e":[["p","Pure Fusion coordonne un parc de systèmes. Son comportement et ses fonctionnalités dépendent de la version prise en charge."]],"t":"Software"},{"n":54,"q":"What is a sound first response to an alert about an array service?","o":{"A":"Assume it is a host filesystem issue","B":"Restart every service immediately","C":"Delete the service configuration","D":"Inspect the alert details, service state, logs, and supported recovery guidance"},"a":"D","e":[["p","Les alertes de service doivent être diagnostiquées à partir d’éléments probants. Évitez les redémarrages généraux sans en comprendre les conséquences."]],"t":"Software"},{"n":55,"q":"Why should support bundles and diagnostics be collected before invasive troubleshooting?","o":{"A":"They replace change control","B":"They guarantee a root cause without analysis","C":"They automatically repair the array","D":"They preserve evidence about the original failure state"},"a":"D","e":[["p","Des informations de diagnostic peuvent être perdues après une réinitialisation ou un changement d’état. Collectez-les selon les procédures prises en charge."]],"t":"Software"},{"n":56,"q":"What is the safest approach to a command found in an online practice bank?","o":{"A":"Assume all commands work across all releases","B":"Verify syntax and impact in the CLI help or official documentation for the installed release","C":"Run it as root immediately on production","D":"Modify it based on guesswork"},"a":"B","e":[["p","Les banques de questions publiques peuvent contenir des erreurs ou une syntaxe propre à certaines versions. Vérifiez avant d’exécuter une commande."]],"t":"Software"},{"n":57,"q":"What does non-disruptive upgrade (NDU) aim to achieve?","o":{"A":"Upgrade supported software while maintaining host data access within the documented process","B":"Replace host multipathing","C":"Guarantee no alert can occur during an upgrade","D":"Change asynchronous replication into synchronous replication"},"a":"A","e":[["p","La NDU vise à préserver l’accès dans les configurations prises en charge, mais les prérequis et le comportement des hôtes restent importants."]],"t":"Software"},{"n":58,"q":"What should be confirmed before an NDU?","o":{"A":"Only the administrator’s browser version","B":"Only the number of snapshots","C":"Only the physical rack color","D":"Release path, array health, host compatibility, and required prechecks"},"a":"D","e":[["p","Suivez la liste de contrôle propre à la version et corrigez d’abord les problèmes d’état de santé qui bloquent l’opération."]],"t":"Software"},{"n":59,"q":"In a Dark Site environment, what should be checked before relying on array support connectivity or phone-home?","o":{"A":"Whether the array routes all host data I/O through phone-home","B":"Whether phone-home replaces replication links","C":"Whether phone-home acts as the Fibre Channel fabric","D":"Whether the environment permits the required outbound support communication and which approved offline support process applies if it does not"},"a":"D","e":[["p","Dans un environnement Dark Site, les communications sortantes peuvent être interdites. Vérifiez la politique réseau et la procédure de support approuvée pour un environnement isolé ; phone-home ne transporte pas les E/S des hôtes."]],"t":"Software"},{"n":60,"q":"In a dark-site environment, what is the key operational concern for alerting?","o":{"A":"Assume Pure1 receives every alert regardless of connectivity","B":"Disable all local alerting","C":"Route host data through SMTP","D":"Use the approved customer-managed alerting path when cloud phone-home is unavailable or prohibited"},"a":"D","e":[["p","Les environnements isolés du réseau externe (*air-gapped*) nécessitent un processus local approuvé pour les notifications et le support."]],"t":"Software"},{"n":61,"q":"Why is a documented change plan important when changing host or array configuration?","o":{"A":"It makes diagnostics unnecessary","B":"It establishes impact, validation, ownership, and rollback steps","C":"It automatically increases performance","D":"It removes the need for authorization"},"a":"B","e":[["p","Des changements contrôlés réduisent les risques et facilitent l’identification de l’effet de chaque modification."]],"t":"Software"},{"n":62,"q":"Which statement about Evergreen is most accurate in a support context?","o":{"A":"It is a subscription and lifecycle program, not the name of one specific controller-failover feature","B":"It is a replication mediator protocol","C":"It is the RAID level used by all FlashArrays","D":"It is a host multipath policy"},"a":"A","e":[["p","Ne confondez pas le programme Evergreen avec un mécanisme spécifique de haute disponibilité."]],"t":"Software"},{"n":63,"q":"What should you do if documentation and a third-party practice question disagree?","o":{"A":"Always prefer the practice question","B":"Prefer current official documentation and record the discrepancy for verification","C":"Ignore the Purity version","D":"Average the two answers"},"a":"B","e":[["p","La documentation officielle correspondant à la version doit prévaloir sur les supports d’entraînement dont les affirmations ne sont pas sourcées."]],"t":"Software"},{"n":64,"q":"What is the main difference between synchronous and asynchronous replication?","o":{"A":"Synchronous replication coordinates writes across sites before acknowledging according to its design; asynchronous replication ships changes later","B":"Synchronous replication requires no network","C":"Both always have identical recovery point objectives","D":"Asynchronous replication never uses network bandwidth"},"a":"A","e":[["p","Les modèles diffèrent par la coordination des écritures et le RPO atteignable. Consultez le guide propre au produit pour connaître la sémantique exacte."]],"t":"Replication"},{"n":65,"q":"Which replication model is associated with ActiveCluster?","o":{"A":"Host-based tape backup","B":"Periodic file export only","C":"Synchronous active/active replication between supported FlashArrays","D":"A DNS failover service"},"a":"C","e":[["p","ActiveCluster assure une réplication synchrone avec un accès hôte actif/actif dans les configurations prises en charge."]],"t":"Replication"},{"n":66,"q":"What role does the ActiveCluster mediator play?","o":{"A":"It helps resolve arbitration or split-brain decisions when connectivity is impaired","B":"It replaces host multipathing","C":"It performs inline compression","D":"It stores all primary volume data"},"a":"A","e":[["p","Le médiateur participe à l’arbitrage. Il n’est ni le stockage principal des données ni un substitut aux chemins hôtes."]],"t":"Replication"},{"n":67,"q":"Why should a mediator be placed in an independent failure domain where possible?","o":{"A":"To force all reads through the mediator","B":"To reduce the array’s logical capacity","C":"To reduce the chance that the same failure affects both arrays and arbitration service","D":"To eliminate the need for network connectivity"},"a":"C","e":[["p","Un placement indépendant augmente les chances d’obtenir un résultat d’arbitrage sans ambiguïté en cas de panne de site ou de réseau."]],"t":"Replication"},{"n":68,"q":"What is the purpose of a preferred array setting in ActiveCluster?","o":{"A":"To select an Ethernet MTU","B":"To change the array’s Purity version","C":"To influence arbitration behavior in a partition or failure scenario","D":"To define the volume’s filesystem"},"a":"C","e":[["p","Le comportement de la baie préférée aide à orienter l’arbitrage. Suivez les recommandations de conception ActiveCluster à jour."]],"t":"Replication"},{"n":69,"q":"What is ActiveDR primarily designed to provide?","o":{"A":"A replacement for local snapshots only","B":"Synchronous zero-RPO replication under all conditions","C":"Ethernet link aggregation","D":"Asynchronous replication with recovery at a remote site and a non-zero/variable RPO"},"a":"D","e":[["p","ActiveDR fonctionne en asynchrone. Le RPO réel dépend de la charge, de la liaison et de l’état des systèmes."]],"t":"Replication"},{"n":70,"q":"What does a Protection Group typically organize for replication?","o":{"A":"A set of DNS records","B":"A set of Ethernet ports","C":"A set of volumes and their protection/replication policy","D":"A set of controller fans"},"a":"C","e":[["p","Les groupes de protection définissent la stratégie et les volumes protégés, y compris la réplication lorsqu’elle est configurée."]],"t":"Replication"},{"n":71,"q":"What should be checked when asynchronous replication is delayed?","o":{"A":"Only host filesystem free space","B":"Only the array’s front-panel color","C":"Replication link health, bandwidth, lag, protection-group state, and workload changes","D":"Only the number of administrators"},"a":"C","e":[["p","Un retard de réplication peut résulter de la connectivité, de la charge, de la stratégie ou de l’état du système. Corrélez ces éléments."]],"t":"Replication"},{"n":72,"q":"Why should a replication network be treated separately from ordinary host access paths during troubleshooting?","o":{"A":"It has its own connectivity, bandwidth, and latency requirements","B":"Replication uses no network","C":"It always uses the host’s filesystem","D":"It is controlled only by DNS"},"a":"A","e":[["p","La réplication dépend d’un chemin inter-baies pris en charge. Diagnostiquez-la à partir des informations propres à la connexion et aux performances."]],"t":"Replication"},{"n":73,"q":"What is the risk of assuming a replication relationship is healthy just because both arrays are online?","o":{"A":"The connection, policy, authorization, or replication lag may still be unhealthy","B":"It proves the mediator is healthy","C":"It guarantees zero RPO","D":"It proves the latest snapshot is at the target"},"a":"A","e":[["p","La disponibilité de la baie ne prouve pas, à elle seule, que la réplication est à jour et autorisée."]],"t":"Replication"},{"n":74,"q":"What is a key difference between a snapshot and a replicated copy?","o":{"A":"A snapshot is a point-in-time state on a system; replication transfers protected data to another system or location","B":"A snapshot always survives loss of its array","C":"They are always identical in failure-domain protection","D":"Replication never uses snapshots internally"},"a":"A","e":[["p","Les snapshots et la réplication répondent à des besoins de récupération différents. Évaluez les domaines de panne indépendants et la rétention."]],"t":"Replication"},{"n":75,"q":"Why is recovery testing important for replicated data?","o":{"A":"It changes replication to synchronous mode automatically","B":"It guarantees no future data loss","C":"It removes the need for monitoring","D":"It verifies that the target data and documented recovery procedure meet application requirements"},"a":"D","e":[["p","Une relation configurée ne dispense pas de valider la récupération de l’application et les étapes opérationnelles."]],"t":"Replication"},{"n":76,"q":"What should be documented before promoting a replicated workload at a recovery site?","o":{"A":"Only the array serial number","B":"Only the volume display names","C":"The source/target roles, application dependencies, consistency needs, and failback plan","D":"Only the administrator’s email address"},"a":"C","e":[["p","Une promotion peut modifier les rôles et le sens du flux de données. Comprenez les dépendances et le retour au fonctionnement normal."]],"t":"Replication"},{"n":77,"q":"What is a safe first step when a replication connection reports unavailable?","o":{"A":"Immediately recreate every protection group","B":"Erase target snapshots","C":"Check the documented connection status and network reachability between arrays","D":"Disable authentication on both arrays"},"a":"C","e":[["p","Utilisez les commandes d’état prises en charge et vérifiez la connectivité réseau avant toute modification destructive."]],"t":"Replication"},{"n":78,"q":"What does RPO describe?","o":{"A":"The time required to replace a controller","B":"The total physical capacity of the target","C":"The amount of data loss measured in time that a recovery strategy may tolerate","D":"The number of network ports in use"},"a":"C","e":[["p","Le RPO est un objectif de récupération exprimé en durée ; il ne correspond pas au temps nécessaire à la reprise."]],"t":"Replication"},{"n":79,"q":"What does RTO describe?","o":{"A":"The ratio of compressed to raw data","B":"The maximum number of snapshots","C":"The target time to restore service after an outage","D":"The number of FC initiators"},"a":"C","e":[["p","Le RTO concerne la durée de reprise, tandis que le RPO concerne la perte de données temporelle acceptable."]],"t":"Replication"},{"n":80,"q":"What does Fibre Channel zoning primarily control?","o":{"A":"Which initiators and storage targets are permitted to communicate in the fabric","B":"The array’s snapshot schedule","C":"The controller’s software version","D":"The data-reduction ratio"},"a":"A","e":[["p","Le zoning contrôle la visibilité au niveau de la fabric. Vérifiez le zoning des commutateurs ainsi que la configuration des hôtes côté baie."]],"t":"Networking"},{"n":81,"q":"What is the purpose of an SFP in a storage network port?","o":{"A":"It replaces the host HBA driver","B":"It provides the physical transceiver interface for the link medium and speed","C":"It performs snapshot replication","D":"It defines the array’s volume size"},"a":"B","e":[["p","Un émetteur-récepteur et un câble compatibles et en bon état font partie du diagnostic d’une liaison."]],"t":"Networking"},{"n":82,"q":"What is LACP used for?","o":{"A":"To aggregate supported Ethernet links into a logical link/bond","B":"To elect an ActiveCluster mediator","C":"To replicate snapshots between arrays","D":"To provide host multipathing across independent SAN fabrics"},"a":"A","e":[["p","LACP sert à agréger des liens ; il est distinct du multipathing du stockage et de la réplication."]],"t":"Networking"},{"n":83,"q":"Why should LACP not be treated as a replacement for host multipathing?","o":{"A":"LACP only encrypts storage traffic","B":"Multipathing is a snapshot feature","C":"Both are identical protocols","D":"LACP aggregates Ethernet links, while multipathing selects and manages storage paths from a host"},"a":"D","e":[["p","Ces mécanismes opèrent à des couches différentes et répondent à des besoins distincts de disponibilité et de performance."]],"t":"Networking"},{"n":84,"q":"How should jumbo-frame MTU be validated for an IP storage path?","o":{"A":"Change only the array DNS domain","B":"Set MTU 9000 on one device and assume the whole path supports it","C":"Confirm supported MTU and end-to-end consistency on the host, every switch hop, and the array interface, using an appropriate path test","D":"Disable path redundancy"},"a":"C","e":[["p","La valeur MTU doit être prise en charge et cohérente sur tout le chemin. Vérifiez chaque segment et effectuez un test de chemin adapté au protocole ; une seule interface configurée à 9000 octets ne suffit pas."]],"t":"Networking"},{"n":85,"q":"What should be reviewed when iSCSI sessions repeatedly disconnect?","o":{"A":"Only the chassis serial number","B":"IP reachability, VLANs, MTU, switch counters, target portals, and host session logs","C":"Only the snapshot schedule","D":"Only the array’s compression ratio"},"a":"B","e":[["p","Examinez l’ensemble du chemin et corrélez les éléments provenant de l’hôte et du réseau."]],"t":"Networking"},{"n":86,"q":"When troubleshooting IPv4 or IPv6 management reachability, what should be verified first?","o":{"A":"That IPv6 is enabled on every interface by default","B":"The addressing, routes, interface support, and configuration documented for the deployed Purity release and network design","C":"That routing can be disabled without impact","D":"That both controllers use the same IP address"},"a":"B","e":[["p","La prise en charge et la configuration IPv4/IPv6 dépendent de la version et de l’architecture réseau. Vérifiez les adresses, routes et interfaces concernées dans la documentation applicable plutôt que de supposer que toutes les interfaces utilisent IPv6."]],"t":"Networking"},{"n":87,"q":"When troubleshooting Kerberos authentication for FA File, which set of dependencies should be checked?","o":{"A":"Kerberos is used only for block iSCSI","B":"Supported SMB/NFS configuration as applicable, directory integration, DNS/name resolution, and time synchronization","C":"Kerberos automatically repairs network failures","D":"Kerberos replaces the storage array"},"a":"B","e":[["p","Kerberos dépend de la configuration du service de fichiers prise en charge, de l’intégration à l’annuaire, de la résolution des noms et de la synchronisation horaire. Validez les prérequis précis pour le protocole et la version concernés."]],"t":"Networking"},{"n":88,"q":"What is the purpose of a management or SSL certificate on an array service?","o":{"A":"To increase flash write endurance","B":"To configure storage volume size","C":"To control synchronous replication RPO","D":"To establish identity and protect supported management/service connections"},"a":"D","e":[["p","La validité et la confiance du certificat affectent les connexions sécurisées de gestion ou de service, et non le taux de réduction des données de la baie."]],"t":"Networking"},{"n":89,"q":"What is a sensible response to a certificate-expiration warning?","o":{"A":"Inspect certificate validity, trust chain, affected service, and the supported renewal procedure","B":"Replace all storage controllers","C":"Disable TLS permanently","D":"Delete all certificates immediately"},"a":"A","e":[["p","Les problèmes de certificats doivent être résolus à l’aide des procédures prises en charge de rotation ou de renouvellement, après vérification de leur impact."]],"t":"Networking"},{"n":90,"q":"What is the key operational distinction between support telemetry and host storage traffic?","o":{"A":"Support telemetry is the only path for host I/O","B":"Support telemetry is the array’s internal flash bus","C":"Support telemetry is used for support-related communication when enabled and permitted; it is not the host data path","D":"Support telemetry carries all Fibre Channel traffic"},"a":"C","e":[["p","La télémétrie de support sert aux communications de support lorsque cette fonction est activée et autorisée. Elle est distincte des chemins de données FC, iSCSI, NVMe-TCP ou SMB des hôtes."]],"t":"Networking"},{"n":91,"q":"Which information is most useful when escalating an intermittent network issue?","o":{"A":"Timestamps, affected interfaces/paths, counters, topology, and relevant logs from both ends","B":"Only the array’s purchase date","C":"Only a list of volume names","D":"Only a screenshot of the desktop wallpaper"},"a":"A","e":[["p","Un dossier d’escalade utile comprend des éléments horodatés et corrélés provenant de la baie, de l’hôte et du réseau."]],"t":"Networking"},{"n":92,"q":"A hardware component appears in the inventory but an alert reports a degraded state. What should support do next?","o":{"A":"Assume inventory visibility proves the component is healthy","B":"Clear the alert without recording its details","C":"Replace the component without checking the model-specific procedure","D":"Review the exact alert and component status, collect the relevant diagnostics, and follow the model-specific service procedure"},"a":"D","e":[["p","La présence d’un composant dans l’inventaire ne signifie pas qu’il est sain. Examinez l’alerte exacte, l’état du composant et les diagnostics associés, puis suivez la procédure de service correspondant au modèle."]],"t":"Hardware"},{"n":93,"q":"A hardware alert includes the detail “Slow link speed.” What is the safest first action?","o":{"A":"Change the DNS search suffix","B":"Replace a FlashModule immediately without checking the alert procedure","C":"Identify the exact alert and affected component, inspect its documented diagnostic steps, and verify related link/component status before reseating or replacing anything","D":"Reset the SMB password"},"a":"C","e":[["p","Le libellé « Slow link speed » ne doit pas conduire automatiquement à remplacer ou réinsérer un composant. Identifiez l’alerte exacte et le composant concerné, puis appliquez la procédure documentée avant toute intervention."]],"t":"Hardware"},{"n":94,"q":"What should be confirmed before evacuating a DirectFlash Shelf?","o":{"A":"Sufficient remaining capacity and the documented prerequisites for evacuation","B":"That all hosts are permanently disconnected","C":"That every snapshot has been deleted","D":"That the mediator is disabled"},"a":"A","e":[["p","L’évacuation déplace les données hors d’une étagère. Vérifiez la capacité disponible et l’état de santé avant de commencer."]],"t":"Hardware"},{"n":95,"q":"Two shelves appear to report the same shelf ID after a chassis change. What is the safest response?","o":{"A":"Stop and follow the documented shelf-ID recovery procedure with Pure Support guidance; do not edit internal files manually","B":"Change the host WWNs","C":"Manually edit internal controller files","D":"Pull all shelves simultaneously while host I/O continues"},"a":"A","e":[["p","Un conflit d’identifiants d’étagère est un cas matériel spécifique. N’effectuez pas de modification interne non documentée ; suivez la procédure officielle correspondant au modèle avec l’assistance appropriée."]],"t":"Hardware"},{"n":96,"q":"What should be checked when a controller reports an unexpected hardware state?","o":{"A":"Controller status, alerts, recent events, and supported diagnostics","B":"Only the SMB share name","C":"Only the data-reduction ratio","D":"Only the replication schedule name"},"a":"A","e":[["p","Collectez l’état et les journaux avant de décider d’une intervention matérielle."]],"t":"Hardware"},{"n":97,"q":"Why is NVRAM health important in a FlashArray?","o":{"A":"It controls LACP negotiation","B":"It participates in protecting acknowledged write data according to the array’s architecture","C":"It determines the host’s DNS resolution","D":"It is the same thing as a snapshot"},"a":"B","e":[["p","La NVRAM fait partie de l’architecture de protection des écritures. Suivez attentivement les alertes et les consignes de récupération."]],"t":"Hardware"},{"n":98,"q":"Before taking action on a new hardware alert, what should the support specialist do first?","o":{"A":"Replace the named part immediately","B":"Clear the alert and ignore recurrence","C":"Reboot both controllers in parallel","D":"Record the exact alert ID and details, check current component state and related alerts, then follow the supported diagnostic procedure"},"a":"D","e":[["p","La première étape consiste à identifier précisément l’alerte et son contexte, puis à vérifier l’état du composant et les alertes associées. Toute intervention doit suivre la procédure de diagnostic et de remplacement prise en charge."]],"t":"Hardware"},{"n":99,"q":"What do redundant controllers provide in a supported FlashArray configuration?","o":{"A":"A replacement for external SAN switches","B":"High availability and continued service through supported failover scenarios, subject to the system design and failure conditions","C":"One active controller and one permanently powered-off spare","D":"Storage of all persistent data only in controller RAM"},"a":"B","e":[["p","Les contrôleurs redondants contribuent à la haute disponibilité et au traitement des scénarios de basculement pris en charge. Cela ne constitue pas une garantie absolue contre toute interruption : le résultat dépend du modèle et de la panne."]],"t":"Hardware"},{"n":100,"q":"Why should hardware replacement be coordinated with support procedures?","o":{"A":"All parts are hot-swappable in every configuration without exception","B":"It automatically improves data reduction","C":"The correct part, slot, sequence, and health checks matter to preserve availability and data protection","D":"It removes the need for logs"},"a":"C","e":[["p","La maintenance matérielle doit suivre les instructions propres au modèle et au composant."]],"t":"Hardware"},{"n":101,"q":"For a recurring hardware alert that must be escalated, which evidence package is most useful?","o":{"A":"Only the host filesystem type","B":"Only the array display name","C":"Only the administrator username","D":"Alert ID/details and recurrence times, affected component and status, relevant diagnostics, and changes immediately preceding the event"},"a":"D","e":[["p","Pour une escalade matérielle récurrente, rassemblez les identifiants d’alerte, les horaires de récurrence, l’état du composant, les diagnostics pertinents et les changements récents. Cela permet de distinguer un événement ponctuel d’un problème reproductible."]],"t":"Hardware"},{"n":102,"q":"Why should an operator verify remaining array health after a component replacement?","o":{"A":"To force every volume to become thick provisioned","B":"To confirm the component is recognized, alerts clear as expected, and redundancy/rebuild work is complete","C":"To change the array’s Purity version","D":"To reset all host WWNs"},"a":"B","e":[["p","Le remplacement n’est terminé que lorsque les contrôles d’état et de reconstruction pris en charge confirment le résultat attendu."]],"t":"Hardware"}];      // n, q = énoncé, o = options, a = bonne réponse, e = explication (blocs), t = thème, x = description d'exhibit
