<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="author" content="Mohamed BARR">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FE5000">
<title>Everpure Certified FlashArray Support Specialist (FASS) – QCM</title>
<!-- Seule ressource externe (facultative) : police Google Fonts. Sans connexion, la pile de secours système est utilisée. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Jetons de design (modifiez ici les couleurs de la marque) ============ */
:root{
  --creme:#FEF6E3;           /* fond crème de l'en-tête (couleur du logo) */
  --noir:#1C1C1C;            /* sombre / mode nuit officiel */
  --orange:#FE5000;          /* orange Pure Storage / Everpure */
  --orange-fonce:#D94400;
  --orange-pale:#FFEDE3;
  --encre:#2A2A2A;           /* texte principal */
  --gris:#6B6B6B;            /* texte secondaire */
  --bg:#F4F4F2;              /* arrière-plan du portail */
  --carte:#FFFFFF;
  --trait:#E2E2DE;
  --ok:#1A8F4C; --ok-bg:#E6F6EC;
  --ko:#D32F2F; --ko-bg:#FDECEC;
  --hdr:#FEF6E3; --hdr-trait:#EADFC6; --champ-trait:#9a9a9a;
  --rayon:12px;
  --police:'Figtree','Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
:root[data-theme=dark]{--bg:#121212;--carte:#1C1C1C;--encre:#EDEDED;--gris:#A3A3A3;--trait:#333;--orange-fonce:#FF8A4C;--orange-pale:#3A2113;
  --ok:#3DBE74;--ok-bg:#12301F;--ko:#FF6B6B;--ko-bg:#3A1717;--hdr:#1C1C1C;--hdr-trait:#333;--champ-trait:#777;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--police);background:var(--bg);color:var(--encre);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ============ Arrière-plans officiels Pure Storage (fournis) ============ */
/* Arrière-plan Orange Pure Storage */
.bg-pure-orange { background-color: #FE5000; }
/* Arrière-plan Sombre / Mode Nuit officiel */
.bg-pure-dark { background-color: #1C1C1C; }

/* ============ En-tête ============ */
header{background:var(--hdr);color:var(--encre);border-bottom:1px solid var(--hdr-trait);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.entete{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lien-accueil{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--encre);font-weight:800;font-size:1rem;padding:6px 4px}
.lien-accueil:hover{color:var(--orange)}
.score-live{margin-left:auto;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.barre-globale{height:6px;background:var(--orange)}
.barre-globale div{height:100%;width:0;background:var(--orange);transition:width .4s ease}

.banniere-in{max-width:960px;margin:0 auto;padding:28px 20px 34px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.banniere h1{color:#fff;font-size:clamp(1.7rem,4.4vw,2.6rem);line-height:1.15;margin:0 0 14px}
.banniere p{color:#cfcfcf;margin:0;max-width:44ch;font-size:1.02rem}
.banniere img{width:100%;height:auto;display:block}
.liseré{height:6px}
body.hors-sommaire .banniere,body.hors-sommaire .liseré{display:none}
main{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:28px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:1.2rem;margin:0 0 12px}
.sous-titre{color:var(--gris);margin:0 0 22px;max-width:62ch}

/* ============ Boutons ============ */
.btn{border:1.5px solid var(--encre);background:var(--carte);color:var(--encre);border-radius:8px;padding:11px 20px;font-weight:700;transition:background .15s,color .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--encre);color:var(--carte)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primaire{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primaire:hover:not(:disabled){background:var(--orange-fonce);border-color:var(--orange-fonce)}
.rangee{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ============ Sommaire ============ */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 24px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--gris);font-size:.85rem}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:20px 0 26px}
.pastille{aspect-ratio:1;border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;font-weight:700;color:var(--encre);transition:transform .1s,border-color .15s}
.pastille:hover{border-color:var(--orange);transform:translateY(-2px)}
.pastille.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pastille.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.pastille.sel{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-fonce)}
.pastille.courante{box-shadow:0 0 0 3px var(--orange)}
.legende{display:flex;gap:18px;flex-wrap:wrap;color:var(--gris);font-size:.85rem;margin-bottom:6px}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--trait);background:var(--carte)}
.legende i.ok{background:var(--ok-bg);border-color:var(--ok)} .legende i.ko{background:var(--ko-bg);border-color:var(--ko)}

/* ============ Page question ============ */
.haut-q{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.num-q{font-weight:800;color:var(--orange-fonce);font-size:.95rem}
.lien{background:none;border:0;color:var(--gris);font-weight:600;text-decoration:underline;padding:4px}
.lien:hover{color:var(--orange-fonce)}
.mini-barre{height:6px;background:var(--trait);border-radius:99px;overflow:hidden;margin-bottom:22px}
.mini-barre div{height:100%;background:var(--orange);transition:width .3s}
.enonce{font-size:1.2rem;font-weight:600;line-height:1.45;margin:0 0 22px;max-width:70ch}
.options{display:grid;gap:10px;margin:0 0 22px;padding:0;border:0}
.option{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.option:hover{border-color:var(--orange)}
.option input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--champ-trait);border-radius:6px;background:var(--carte);display:grid;place-items:center;cursor:inherit;transition:all .15s}
.option input::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .15s}
.option input:checked{background:var(--orange);border-color:var(--orange)}
.option input:checked::after{transform:rotate(-45deg) scale(1)}
.option.choisie{border-color:var(--orange);background:var(--orange-pale)}
.lettre{font-weight:800;color:var(--gris);min-width:1.1em}
.texte-opt{flex:1;word-break:break-word}
.option.bonne{border-color:var(--ok);background:var(--ok-bg)}
.option.bonne input{background:var(--ok);border-color:var(--ok)}
.option.bonne input::after{transform:rotate(-45deg) scale(1)}
.option.mauvaise{border-color:var(--ko);background:var(--ko-bg)}
.option.mauvaise input{background:var(--ko);border-color:var(--ko)}
.option.verrou{cursor:default}
.badge{font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap;align-self:center}
.option.bonne .badge{background:var(--ok);color:#fff}
.option.mauvaise .badge{background:var(--ko);color:#fff}

/* Feedback animé (technique grid-template-rows 0fr → 1fr) */
.feedback{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s ease,opacity .35s ease,margin .35s}
.feedback.ouvert{grid-template-rows:1fr;opacity:1;margin-bottom:22px}
.feedback>div{overflow:hidden}
.fb-corps{border-radius:10px;padding:18px 20px;border-left:6px solid}
.fb-corps.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb-corps.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb-titre{font-weight:800;font-size:1.1rem;margin:0 0 6px}
.fb-corps.ok .fb-titre{color:var(--ok)} .fb-corps.ko .fb-titre{color:var(--ko)}
.fb-corps p{margin:0 0 6px;max-width:72ch}
.fb-corps .expl-label{font-weight:700;margin-top:8px}

.nav-q{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--trait);padding-top:20px}
.fleche{width:46px;height:46px;padding:0;font-size:1.2rem;display:grid;place-items:center}
.nav-centre{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ============ Résumé ============ */
.bilan{text-align:center;padding:12px 0 8px}
.pourcent{font-size:clamp(3rem,12vw,5rem);font-weight:800;line-height:1;color:var(--orange);letter-spacing:-.03em}
.bilan .detail{font-size:1.15rem;font-weight:600;margin:6px 0 18px}
.grande-barre{height:16px;border-radius:99px;background:var(--trait);overflow:hidden;display:flex;max-width:560px;margin:0 auto 10px}
.grande-barre .v{background:var(--ok);height:100%;transition:width .7s ease}
.grande-barre .r{background:var(--ko);height:100%;transition:width .7s ease}
.repartition{color:var(--gris);font-size:.9rem;margin-bottom:22px}
.revue{margin-top:30px;display:grid;gap:14px}
.revue-item{border:1px solid var(--trait);border-radius:10px;padding:18px;background:var(--carte)}
.revue-item.ok{border-left:6px solid var(--ok)} .revue-item.ko{border-left:6px solid var(--ko)} .revue-item.nr{border-left:6px solid #b5b5b0}
.revue-item h3{font-size:1rem;margin:0 0 12px;line-height:1.4}
.revue-item .options{margin-bottom:10px}
.revue-item .option{cursor:default;padding:10px 14px}
details summary{cursor:pointer;font-weight:700;color:var(--orange-fonce);padding:4px 0}
details p{margin:6px 0 0}

/* ---- Pied de page / copyright ---- */
footer{max-width:960px;margin:0 auto;padding:0 20px 36px;text-align:center;font-size:.82rem;color:var(--gris)}
footer p{margin:0 0 4px}
.copyright{font-weight:600;color:var(--encre)}
/* ---- Boutons d'en-tête ---- */
.icone{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--hdr-trait);background:transparent;color:var(--encre);font-size:1.05rem;display:grid;place-items:center;padding:0}
.icone:hover{border-color:var(--orange);color:var(--orange)}
[hidden]{display:none!important}   /* l'attribut hidden doit l'emporter sur display:grid des boutons ronds */
.score-live{margin-left:auto}
/* ---- Filtres (statut / thème) ---- */
.filtres{display:grid;gap:8px;margin:18px 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips small{color:var(--gris);font-weight:700;min-width:56px}
.chip{border:1.5px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:99px;padding:5px 12px;font-size:.84rem;font-weight:600}
.chip:hover{border-color:var(--orange)}
.chip.actif{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.vide{opacity:.45}
.apropos h3{font-size:1.1rem;margin:24px 0 8px}
.modale{position:fixed;inset:0;z-index:2500;background:rgba(10,10,10,.6);display:grid;place-items:center;padding:20px}
.modale-corps{background:var(--carte);color:var(--encre);border-radius:12px;padding:24px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modale-corps p{margin:0 0 18px;white-space:pre-line;font-weight:600}
.apropos p,.apropos li{max-width:72ch}
/* ---- Texte enrichi et exhibits ---- */
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--orange-pale);padding:1px 6px;border-radius:5px;font-size:.9em;word-break:break-word}
.exhibit{margin:0 0 22px;border:1.5px solid var(--trait);border-radius:10px;overflow:hidden;background:var(--carte)}
.exhibit-img{position:relative;display:block;width:100%;border:0;padding:0;background:var(--bg);cursor:zoom-in}
.exhibit-img img{display:block;width:100%;max-height:420px;object-fit:contain}
.loupe{position:absolute;right:10px;bottom:10px;background:rgba(28,28,28,.88);color:#fff;border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700}
.exhibit details,.exhibit figcaption{padding:10px 16px;margin:0}
.exhibit figcaption{border-left:6px solid var(--orange);background:var(--orange-pale);font-size:.95rem}
/* ---- Zoom plein écran ---- */
.zoom{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2000;background:rgba(10,10,10,.94);display:flex;flex-direction:column}
.zoom-barre{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;color:#fff;flex-wrap:wrap}
.zoom-barre button{background:#2b2b2b;color:#fff;border:1px solid #555;border-radius:8px;min-width:42px;height:40px;font-weight:700;padding:0 12px}
.zoom-barre button:hover{border-color:var(--orange)}
.zoom-barre span{min-width:60px;text-align:center;font-weight:700}
.zoom-scene{flex:1;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.zoom-scene:active{cursor:grabbing}
.zoom-scene img{max-width:96%;max-height:96%;transform-origin:center;background:#fff;-webkit-user-drag:none}
/* ---- Protection anti-reproduction (voir PROTECTION dans le script) ---- */
body.anti-copie{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.anti-copie input{-webkit-user-select:auto;user-select:auto}
#rapport{display:none}
button.option{width:100%;text-align:left;color:var(--encre)}
@media print{
  body.export-pdf>*:not(#rapport){display:none!important}
  body.export-pdf #rapport{display:block;color:#000;background:#fff;font:13px/1.45 Arial,sans-serif;padding:8mm}
  #rapport h1{font-size:20px;color:#FE5000;margin:0 0 6px} #rapport h2{font-size:15px;margin:16px 0 6px}
  #rapport table{width:100%;border-collapse:collapse} #rapport th,#rapport td{border:1px solid #bbb;padding:4px 8px;text-align:left}
  #rapport .rq{break-inside:avoid;border-left:4px solid #FE5000;padding-left:8px;margin:0 0 8px}
  body.sans-impression:not(.export-pdf)>*{display:none!important}
  body.sans-impression:not(.export-pdf)::before{content:"Impression désactivée – © Mohamed BARR";display:block;font:700 20px Arial,sans-serif;padding:40px}
}
/* ---- Marquage (drapeau) ---- */
.btn.drapeau{padding:7px 14px;font-size:.88rem;border-width:1.5px}
.btn.drapeau.actif{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-fonce)}
.btn.drapeau.actif:hover:not(:disabled){background:var(--orange);color:#fff}
.pastille{position:relative}
.pastille.marque::after{content:"";position:absolute;top:-1.5px;right:-1.5px;border:9px solid transparent;border-top-color:var(--orange);border-right-color:var(--orange);border-top-right-radius:10px}
.legende i.flag{background:var(--orange);border-color:var(--orange)}
/* ---- Mode examen ---- */
.panneau-examen{border:1.5px solid var(--trait);border-left:8px solid var(--orange);border-radius:10px;padding:16px 20px;margin:0 0 26px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panneau-examen strong{display:block;font-size:1.05rem}
.panneau-examen span{color:var(--gris);font-size:.92rem}
.regles{margin:0 0 24px;padding-left:20px;max-width:68ch}
.regles li{margin-bottom:8px}
.score-live.attention{background:#B26A00}
.score-live.urgence{background:var(--ko)}
.verdict{display:inline-block;padding:6px 20px;border-radius:99px;font-weight:800;color:#fff;margin-bottom:14px}
.verdict.ok{background:var(--ok)} .verdict.ko{background:var(--ko)}
.avis{background:var(--orange-pale);border-radius:8px;padding:10px 14px;margin:0 auto 16px;max-width:560px;font-weight:600}
@media (max-width:720px){
  .banniere-in{grid-template-columns:1fr;padding:22px 20px 26px}
  .banniere img{order:-1;max-width:420px;margin:0 auto}
}
@media (max-width:600px){
  .carte{padding:18px}
  .nav-q{flex-direction:column-reverse;align-items:stretch}
  .nav-centre{justify-content:space-between}
  .nav-centre .btn.primaire{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ============ Mode lecture : confort visuel (police légèrement réduite, interligne aéré, fond « papier », lignes courtes) ============ */
html{font-size:93.75%}                                   /* 15 px au lieu de 16 px */
html[data-taille=grand]{font-size:106.25%}
html[data-taille=petit]{font-size:87.5%}
:root{--bg:#F3F1EB;--carte:#FFFEFA;--encre:#33322E}
body{line-height:1.65;letter-spacing:.005em}
.enonce{font-size:1.12rem;line-height:1.6}
.texte-opt{line-height:1.55}
.option{padding:13px 16px}
.fb-corps p,.revue-item details p,.exhibit details p{line-height:1.7;max-width:66ch}
.fb-corps ul,.revue-item details ul,.apropos ul,.apropos ol{line-height:1.7;max-width:66ch}
.apropos ol{padding-left:1.5em}.apropos ol li{margin-bottom:8px}
.apropos p,.apropos li{line-height:1.7;max-width:66ch}
.revue-item h3{line-height:1.5}
.icone[id=btnTaille]{font-size:.8rem;font-weight:800}
/* ============ En-tête : accueil agrandi, bouton central, groupe d'icônes ============ */
.entete{justify-content:space-between}
.lien-accueil{font-size:1.4rem;gap:12px}
.lien-accueil img{width:42px;height:auto}
.cta-entete{display:none;padding:9px 22px;white-space:nowrap}
body.sur-apropos .cta-entete{display:inline-block}
.droite{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.droite .score-live{margin-left:0}
@media (max-width:720px){
  .cta-entete{order:5;flex:1 1 100%}
  .entete{padding:8px 14px;gap:8px 10px}
  .droite{gap:6px;margin-left:auto}
  .icone{width:32px;height:32px;font-size:.95rem}
  .droite .score-live{padding:5px 11px;font-size:.82rem}
  .lien-accueil .txt-accueil{display:none}      /* mobile : icône seule */
  .lien-accueil{padding:2px}
  .lien-accueil img{width:32px}
  .droite{flex-wrap:nowrap}                    /* tout reste sur une seule ligne */
  body.sur-apropos header{position:static}      /* page 1 : en-tête non collant sur mobile (gain de place) */
}
/* ============ Profil du candidat, félicitations ============ */
.champ{display:grid;gap:4px;margin:0 0 12px}
.champ span{font-size:.85rem;font-weight:700;color:var(--gris)}
.champ input{font:inherit;padding:10px 12px;border:1.5px solid var(--trait);border-radius:8px;background:var(--carte);color:var(--encre)}
.champ input:focus{border-color:var(--orange);outline:none}
.modale-corps h3{margin:0 0 6px}
.modale-corps p.note{font-weight:400;font-size:.88rem;color:var(--gris);margin-bottom:16px}
.profil-carte{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hdr);border:0;border-left:4px solid var(--orange);border-radius:10px;padding:12px 16px;margin:16px 0 4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.felic{font-weight:700;color:var(--ok);margin:0 0 14px}

/* Examen : navigation Précédent / Suivant, bouton « Revue » distinct */
.nav-exam{display:flex;gap:12px;margin-top:22px}
.nav-exam .btn{flex:1;min-height:48px}
.revue-sep{margin-top:18px;padding-top:18px;border-top:1px solid var(--trait)}
.btn-revue{width:100%;min-height:46px;background:var(--encre);color:var(--carte);border-color:var(--encre)}
.btn-revue:hover:not(:disabled){opacity:.88}

/* Domaines couverts : grille de 2 colonnes, pastille numérotée */
.domaines{display:grid;grid-template-columns:1fr 1fr;gap:22px 34px;margin:14px 0 6px}
.dom{display:flex;gap:14px;align-items:flex-start}
.dom p{margin:0;max-width:none;line-height:1.6}

<script>

const QUESTIONS = [{"n": 1, "q": "Which Purity//FA CLI command lists the overall array health, controller state, and software version on a FlashArray?", "o": {"A": "purehw list", "B": "purearray list", "C": "pureservice list", "D": "puredb list"}, "a": "B", "e": [["p", "purearray list renvoie le nom de la baie, son ID, la version du système (Purity//FA) et l’état général de la baie. Les ingénieurs support l’exécutent en premier pour confirmer quelle paire de contrôleurs et quelle version de Purity ils ont devant eux avant tout dépannage plus approfondi."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** purehw list énumère les composants matériels physiques (contrôleurs, châssis, tiroirs, disques, ports) et leur état, pas le résumé au niveau de la baie.", "**C.** pureservice list affiche l’état des services de la baie tels que la réplication, le scrubber et snap-to-NFS, pas l’identité de la baie ni la version de Purity.", "**D.** puredb est une CLI de base de données interne, utilisée pour des diagnostics de bas niveau sur des sous-systèmes individuels, pas la vue de synthèse de la baie."]], ["p", "**Astuce examen :** Lorsque vous ouvrez un cas auprès du support Everpure, joignez toujours la sortie de purearray list : l’ingénieur connaît ainsi immédiatement la version de Purity//FA."]], "t": "Matériel"}, {"n": 2, "q": "A Support Specialist needs to enumerate every physical hardware component on a FlashArray, including controllers, NVRAM modules, DirectFlash modules, fans, and PSUs. Which command should be used?", "o": {"A": "purearray list --all", "B": "purehw list", "C": "puredrive list --total", "D": "pureservice list"}, "a": "B", "e": [["p", "purehw list énumère tous les composants matériels que le contrôleur voit (CT0/CT1, NVRAM, disques DFM, IOM, alimentations, ventilateurs, SFP, ports) avec leur état, leur numéro de série et leur emplacement. C’est la vue de référence pour l’inventaire et l’état du matériel."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** purearray list --all n’est pas le bon jeu d’options ; purearray indique l’identité de la baie, pas le matériel composant par composant.", "**C.** puredrive list se concentre sur l’identité des disques de données et sur les données dégradées, pas sur les composants du châssis comme les ventilateurs ou les alimentations.", "**D.** pureservice list affiche l’état des services logiciels (réplication, snapshots, etc.), pas les composants matériels physiques."]]], "t": "Matériel"}, {"n": 3, "q": "A FlashArray alert reports 'Drive failure detected' with details stating 'Slow link speed'. Which is a likely cause that a Support Specialist should investigate first?", "o": {"A": "Failed cable to a DirectFlash shelf", "B": "A FlashModule that needs to be reseated", "C": "Bad pci_link status caused by a failed NVMe-oF PCIe card", "D": "An expired Management SSL certificate"}, "a": "B", "e": [["p", "D’après le guide d’étude FASS, une alerte « Drive failure detected / Slow link speed » indique le plus souvent qu’un FlashModule (DFM) a perdu la négociation à pleine vitesse et qu’il suffit de le réenficher (reseat). Le DFM retrouve normalement sa vitesse de lien nominale et l’alerte disparaît après un reseat propre."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Un câble de tiroir défaillant provoquerait une alerte de connectivité au niveau du tiroir, touchant de nombreux disques à la fois, et non un message isolé « Drive failure detected: Slow link speed ».", "**C.** Une carte PCIe NVMe-oF défaillante génère une alerte pci_link / port hôte, pas un message « Drive failure detected » lié à un seul DFM.", "**D.** Les problèmes de certificat SSL de gestion se manifestent par des erreurs purecert / d’authentification de l’interface web, pas par des alertes de lien de disque."]]], "t": "Matériel"}, {"n": 4, "q": "Which CLI command will display per-drive degraded data so a Support Specialist can confirm rebuild status during a hardware replacement?", "o": {"A": "puredb list drives", "B": "puredrive list --total", "C": "purehw list --drives", "D": "purearray list --drives"}, "a": "A", "e": [["p", "D’après le guide d’étude FASS, puredb list drives est la commande CLI qui expose les données dégradées par disque. Les Support Specialists l’utilisent pour confirmer que la baie a terminé de reconstruire la parité sur un DirectFlash Module de remplacement avant de clôturer un cas."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** puredrive list --total affiche la capacité totale et la présence des disques, pas les données dégradées par disque.", "**C.** purehw list --drives n’est pas l’option de référence pour le suivi des données dégradées ; purehw n’indique que l’état de santé des composants.", "**D.** purearray list n’affiche pas les données dégradées par disque ; il indique l’état au niveau de la baie."]]], "t": "Matériel"}, {"n": 5, "q": "A FlashArray DirectFlash Shelf needs its shelf ID changed because two shelves share the same ID after a chassis swap. Which approach matches Pure Storage guidance?", "o": {"A": "Pull and reseat the shelf to force ID renegotiation", "B": "Use the Changing the Shelf ID procedure with Pure Support oversight", "C": "Reflash the shelf controller firmware from the GUI", "D": "Manually edit the shelf ID file in /var on each controller"}, "a": "B", "e": [["p", "Everpure publie une procédure de la Knowledge Base, « Changing the Shelf ID », qui s’exécute sous la supervision du support Everpure. Les ID de tiroir doivent être uniques sur une même FlashArray, et la procédure documentée effectue le changement sans interrompre les E/S en cours."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Un reseat ne change pas l’ID d’un tiroir ; l’ID est attribué administrativement et ne dépend pas de la position physique.", "**C.** Reflasher le firmware du tiroir ne réattribue pas l’ID de tiroir et n’a aucun rapport avec la situation d’ID en double.", "**D.** Modifier des fichiers internes dans /var n’est pas une procédure prise en charge et serait refusé par les bonnes pratiques du support Everpure."]]], "t": "Matériel"}, {"n": 6, "q": "Before performing a shelf evacuation on a FlashArray, what must a Support Specialist confirm?", "o": {"A": "That all hosts have been disconnected from the array", "B": "That the array has enough remaining capacity to absorb the data on the target shelf without exceeding safe utilization", "C": "That a controller failover has just completed", "D": "That CloudSnap is paused on every protection group"}, "a": "B", "e": [["p", "L’évacuation d’un tiroir déplace toutes les données du tiroir ciblé vers le stockage restant de la baie. Avant de commencer, le Specialist doit vérifier que la baie dispose d’assez de capacité libre pour accueillir les données évacuées sans dépasser un seuil d’utilisation sûr ; sinon l’évacuation se bloquera ou échouera."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Les hôtes restent en ligne pendant une évacuation de tiroir prise en charge ; la baie continue de servir les E/S.", "**C.** Un basculement de contrôleur n’est pas un prérequis à l’évacuation d’un tiroir.", "**D.** CloudSnap continue de fonctionner normalement ; l’évacuation d’un tiroir n’exige pas de suspendre le déport des groupes de protection."]]], "t": "Matériel"}, {"n": 7, "q": "What is the purpose of a Pure Storage Dark Site alert configuration?", "o": {"A": "It throttles array I/O during firmware updates", "B": "It sends array alerts to a customer-managed destination because phone-home to Pure cloud is not allowed at that site", "C": "It encrypts the management interface using customer-supplied keys", "D": "It quarantines volumes during a ransomware event"}, "a": "B", "e": [["p", "Les clients Dark Site exploitent des environnements isolés (air-gapped) dans lesquels la baie ne peut pas envoyer de phone-home vers Pure1. Les alertes Dark Site acheminent les signaux matériels et logiciels vers des cibles SMTP/SNMP/Syslog gérées par le client, afin que l’équipe locale puisse réagir, puisque les signaux intelligents (smart signals) ne peuvent pas atteindre automatiquement le support Everpure."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** La limitation des E/S pendant les mises à jour n’a aucun rapport avec les alertes Dark Site.", "**C.** La gestion des clés de chiffrement par le client relève des fonctions SafeMode/SED, pas des alertes Dark Site.", "**D.** La mise en quarantaine de volumes lors d’un événement de ransomware est un comportement de SafeMode, pas une fonction d’alerte Dark Site."]]], "t": "Matériel"}, {"n": 8, "q": "A Support Specialist needs to read raw frequent-diagnostics data from FlashArray logs and cloud sources, with output in JSON for further parsing. Which command does this?", "o": {"A": "fa dump bundle", "B": "fa dump fdiag", "C": "fa dump mw", "D": "purearray list --diag"}, "a": "B", "e": [["p", "fa dump fdiag lit les diagnostics fréquents bruts (« fdiag ») provenant des journaux de la FlashArray et des sources cloud, et produit du JSON, conformément à l’exemple du guide d’étude FASS. Les ingénieurs support utilisent cette sortie pour l’analyse hors ligne et pour alimenter des scripts qui recherchent des signatures connues."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** fa dump bundle assemble un lot complet de journaux de support, pas le JSON brut de fdiag.", "**C.** fa dump mw cible les données du metric-warehouse, pas fdiag.", "**D.** purearray list --diag n’est pas une option réelle ; purearray renvoie l’identité de la baie, pas des diagnostics."]]], "t": "Matériel"}, {"n": 9, "q": "Which CLI verifies the current negotiated link speed on an iSCSI Ethernet interface so a Support Specialist can confirm that 25/100 GbE auto-negotiation succeeded?", "o": {"A": "purehw list --all | grep ETH", "B": "purenetwork eth list", "C": "ethtool -S ethX", "D": "purearray list --network"}, "a": "A", "e": [["p", "D’après le guide d’étude FASS, purehw list --all | grep ETH renvoie chaque port Ethernet avec sa vitesse de lien négociée actuelle et son état opérationnel. Le support l’utilise pour confirmer qu’un lien iSCSI 25/100 GbE est actif au débit attendu après un changement de câble, de SFP ou de commutateur."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purenetwork eth list affiche les interfaces Ethernet configurées et leurs adresses IP, mais n’est pas la réponse de référence FASS pour la vitesse de lien négociée.", "**C.** ethtool est un outil hôte Linux, pas une CLI de FlashArray ; les Support Specialists n’exécutent pas ethtool directement sur la baie.", "**D.** purearray list --network n’est pas une combinaison d’options valide."]]], "t": "Performance"}, {"n": 10, "q": "A Support Specialist needs to verify chassis manager mastership during a controller event referenced by Alert 73. Which subsystem is this alert about?", "o": {"A": "The controller pair election that names a single chassis manager master", "B": "The DirectFlash module wear-leveling controller", "C": "The Pure1 cloud telemetry endpoint", "D": "The FA File NFS daemon"}, "a": "A", "e": [["p", "L’alerte 73 correspond à Chassis Manager Mastership Failure : un seul contrôleur peut détenir la maîtrise (mastership) du chassis manager à la fois. Lorsque la mastership ne peut pas être établie, les actions de gestion matérielle (par exemple le contrôle des LED ou l’interrogation des capteurs) deviennent peu fiables et l’alerte se déclenche."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Les alertes d’usure des DirectFlash sont suivies parmi les alertes propres aux disques/DFM, pas sous la mastership du chassis manager.", "**C.** Les problèmes de point de terminaison de télémétrie Pure1 sont signalés par les signaux de phone-home / Dark Site, pas par l’alerte 73.", "**D.** Les problèmes du démon NFS de FA File sont signalés dans les alertes FA File, pas dans celles de la mastership du châssis."]]], "t": "Matériel"}, {"n": 11, "q": "Which Purity//FA CLI command lists volumes on the array with size and provisioning details?", "o": {"A": "purevol list", "B": "puredb list volumes", "C": "purearray list --vols", "D": "purehost list --vols"}, "a": "A", "e": [["p", "purevol list est la commande standard pour lister tous les volumes avec leur taille, leur numéro de série et leur source (par exemple copié depuis une snapshot ou un volume). C’est le point de départ de presque tous les workflows de dépannage du stockage bloc."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** puredb sert aux diagnostics de bas niveau des sous-systèmes, pas à la liste standard des volumes.", "**C.** purearray indique l’identité de la baie ; --vols n’est pas une option documentée pour lister les volumes.", "**D.** purehost list --vols filtre les volumes selon la connexion à l’hôte ; c’est une autre vue, pas la liste de référence des volumes."]]], "t": "Logiciel"}, {"n": 12, "q": "A user belongs to the Storage Admin role on a FlashArray. Which set of actions can that user perform?", "o": {"A": "All FlashArray operations including Remote Assist", "B": "Storage-only operations with the exception of Remote Assist", "C": "Only read-only operations on volumes", "D": "Only host and host-group operations"}, "a": "B", "e": [["p", "D’après la référence RBAC d’Everpure et le guide d’étude FASS, le rôle Storage Admin peut effectuer les opérations purement stockage (volumes, snapshots, groupes de protection, hôtes, groupes d’hôtes) mais ne peut explicitement pas activer Remote Assist. Remote Assist exige le rôle Array Admin."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Seul un Array Admin peut activer Remote Assist ; un Storage Admin ne le peut pas.", "**C.** Storage Admin est un rôle avec droits d’écriture sur les objets de stockage, pas un rôle en lecture seule.", "**D.** Le périmètre du Storage Admin comprend les volumes, les snapshots et les groupes de protection, pas seulement les hôtes."]]], "t": "Logiciel"}, {"n": 13, "q": "Which command creates a protection group called pg_db on a FlashArray?", "o": {"A": "puregroup create pg_db", "B": "pureprotectiongroup create pg_db", "C": "puresched create pg_db", "D": "purevol create --pgroup pg_db"}, "a": "B", "e": [["p", "pureprotectiongroup create <nom> crée un nouveau groupe de protection. Les membres et les cibles de réplication sont ensuite ajoutés avec pureprotectiongroup add, et pureschedule définit la cadence des snapshots et de la réplication."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** puregroup n’est pas une CLI de Purity//FA ; les groupes de protection utilisent pureprotectiongroup.", "**C.** puresched n’est pas une vraie commande ; la bonne commande pour la cadence est pureschedule.", "**D.** purevol create crée un volume ; elle ne crée pas de groupe de protection."]]], "t": "Logiciel"}, {"n": 14, "q": "A protection group needs a snapshot every 4 hours retained for 7 days. Which command sets that schedule?", "o": {"A": "pureschedule create --snap-frequency 4h --snap-days 7 pg_app", "B": "pureschedule add 4h 7d pg_app", "C": "pureschedule set --snap pg_app", "D": "puresnap create --interval 4h --retain 7d pg_app"}, "a": "A", "e": [["p", "pureschedule create avec --snap-frequency et --snap-days définit la cadence des snapshots et la fenêtre de rétention d’un groupe de protection. La cadence est appliquée par Purity//FA sur la baie source ; la réplication et le déport suivent leurs propres options de planification."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** pureschedule add n’est pas la forme documentée ; create avec les options de fréquence et de jours est la bonne.", "**C.** pureschedule set --snap ne précise ni la cadence ni la rétention.", "**D.** puresnap crée des snapshots ponctuelles ; il ne rattache pas de planning récurrent à un groupe de protection."]]], "t": "Logiciel"}, {"n": 15, "q": "Which command takes an immediate, on-demand snapshot of a volume named db1?", "o": {"A": "puresnap create db1", "B": "purevol snap db1", "C": "purevol snapshot --create db1", "D": "puresnap take db1"}, "a": "A", "e": [["p", "puresnap create <volume> prend immédiatement une snapshot du volume. La snapshot obtenue peut être promue en nouveau volume avec purevol copy ou répliquée via un groupe de protection."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purevol snap n’est pas une sous-commande valide de Purity//FA.", "**C.** purevol snapshot --create n’est pas une forme documentée.", "**D.** puresnap take n’est pas une vraie sous-commande ; create est le bon verbe."]]], "t": "Logiciel"}, {"n": 16, "q": "How does Pure FlashArray apply data reduction (deduplication and compression) to incoming writes?", "o": {"A": "It is opt-in per volume", "B": "It is always-on globally for all data on the array", "C": "It is enabled only when SafeMode is active", "D": "It is enabled only for volumes in a protection group"}, "a": "B", "e": [["p", "La réduction de données de Purity//FA (déduplication et compression) est toujours active, à l’échelle globale ; il n’existe aucun interrupteur. Le ratio de réduction est rapporté par baie et contribue à la capacité effective affichée dans l’interface graphique et dans Pure1."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Il n’existe aucune activation volume par volume ; la réduction de données s’applique globalement.", "**C.** SafeMode protège les snapshots contre l’éradication et est indépendant de la réduction de données.", "**D.** Les groupes de protection régissent les snapshots et la réplication, pas la réduction de données."]]], "t": "Logiciel"}, {"n": 17, "q": "What is the role of NVRAM journals in Purity//FA write handling on a FlashArray?", "o": {"A": "They store long-term metadata snapshots", "B": "They acknowledge host writes after committing them to non-volatile cache, then flush to DirectFlash", "C": "They mirror the boot drive between controllers", "D": "They store the SafeMode key vault"}, "a": "B", "e": [["p", "Les écritures entrantes arrivent dans la NVRAM, qui est non volatile, et sont acquittées auprès de l’hôte. Purity regroupe ensuite ces écritures et les destocke vers les DirectFlash. La NVRAM explique pourquoi les écritures peuvent être acquittées avec une latence faible et prévisible."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** La NVRAM est une zone d’attente des écritures, pas un stockage de métadonnées à long terme.", "**C.** Le disque de démarrage dispose de ses propres mécanismes de redondance ; la NVRAM ne le met pas en miroir.", "**D.** Les clés SafeMode sont gérées indépendamment du journal NVRAM."]]], "t": "Performance"}, {"n": 18, "q": "What does Pure Storage SafeMode protect against?", "o": {"A": "Host-side I/O misconfiguration that causes data corruption", "B": "Malicious or accidental eradication of snapshots and protection groups (e.g., during a ransomware event)", "C": "Network partitions during ActiveCluster operation", "D": "DirectFlash module wear-out"}, "a": "B", "e": [["p", "SafeMode empêche l’éradication des snapshots et des groupes de protection par un administrateur (ou un attaquant) sur la baie. Même avec des identifiants complets, l’éradication de snapshots et la désactivation de SafeMode lui-même exigent l’intervention du support Everpure, ce qui empêche les auteurs de ransomware de détruire les copies récupérables."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Les erreurs de configuration d’E/S côté hôte relèvent des guides de bonnes pratiques hôtes, pas de SafeMode.", "**C.** Le médiateur ActiveCluster gère les partitions réseau ; SafeMode n’a aucun rapport.", "**D.** L’usure est gérée par le wear-leveling de Purity et le remplacement des DirectFlash Modules."]]], "t": "Logiciel"}, {"n": 19, "q": "An Array Admin needs to verify that NVRAM is fully charged before scheduling a Purity//FA upgrade. Which alert specifically warns of an undercharged NVRAM condition?", "o": {"A": "Alert 51", "B": "Alert 73", "C": "Alert 5002", "D": "Alert 5056"}, "a": "D", "e": [["p", "L’alerte 5056 correspond à « NVRAM Undercharged ». Les modules NVRAM traversent une coupure d’alimentation du contrôleur grâce à leurs supercondensateurs ; lorsqu’un module NVRAM signale une charge insuffisante, une mise à niveau ou un redémarrage de contrôleur peut être risqué tant que la situation n’est pas résolue."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** L’alerte 51 est « Protection Group Replication Delayed », un problème de réplication.", "**B.** L’alerte 73 est « Chassis Manager Mastership Failure », un problème de gestion du châssis.", "**C.** L’alerte 5002 est « CTIO Timeout », un signal de performance/timeout Fibre Channel."]]], "t": "Logiciel"}, {"n": 20, "q": "Which Pure Fusion (V2) component, when offline, causes certificate rotation to be delayed but allows existing certificates to continue working for a 45-day grace period?", "o": {"A": "Fleet coordinator", "B": "Fleet member array", "C": "Pure1 collector", "D": "FA File daemon"}, "a": "A", "e": [["p", "D’après l’examen d’exemple FASS, lorsque le coordinateur de flotte (fleet coordinator) Fusion est hors ligne, la rotation des certificats est retardée mais les certificats existants restent valides pendant une période de grâce de 45 jours. Les baies continuent de communiquer pendant cette fenêtre, ce qui laisse aux opérateurs le temps de remettre le coordinateur en ligne."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** La panne d’un seul membre de la flotte ne pilote pas la rotation des certificats à l’échelle de la flotte.", "**C.** La disponibilité du collecteur Pure1 ne conditionne pas la période de grâce de Fusion.", "**D.** Le démon FA File n’a aucun rapport avec la rotation des certificats Fusion."]]], "t": "Logiciel"}, {"n": 21, "q": "Which command lists hosts defined on a FlashArray with their WWNs, IQNs, and connected volumes?", "o": {"A": "purehost list", "B": "purevol list --hosts", "C": "purehgroup list", "D": "purearray list --hosts"}, "a": "A", "e": [["p", "purehost list renvoie chaque objet hôte avec ses WWN (FC), IQN (iSCSI) ou NQN (NVMe-oF) et les volumes qui lui sont connectés. C’est le point d’entrée du dépannage de la connectivité côté hôte."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purevol list --hosts n’est pas l’inventaire de référence des hôtes ; c’est une vue centrée sur les volumes.", "**C.** purehgroup list affiche les groupes d’hôtes, pas les identités individuelles des hôtes.", "**D.** purearray list ne liste pas les hôtes."]]], "t": "Logiciel"}, {"n": 22, "q": "Which command creates a host group named esx_cluster1 to map a set of volumes to multiple ESXi hosts at once?", "o": {"A": "purehgroup create esx_cluster1", "B": "purehost create --group esx_cluster1", "C": "purevol connect --hgroup esx_cluster1", "D": "puregroup create esx_cluster1"}, "a": "A", "e": [["p", "purehgroup create <nom> définit un nouveau groupe d’hôtes. Les hôtes sont ajoutés avec purehgroup add et les volumes sont connectés au groupe avec purevol connect --hgroup ou purehgroup connect."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purehost --group n’est pas une forme de création valide ; les groupes d’hôtes utilisent purehgroup.", "**C.** purevol connect connecte un volume existant à un groupe d’hôtes existant ; elle ne crée pas le groupe.", "**D.** puregroup n’est pas une commande de Purity//FA."]]], "t": "Logiciel"}, {"n": 23, "q": "A Support Specialist needs to identify all host WWNs that are currently logged into a specific Fibre Channel port on the array. Which command should be used?", "o": {"A": "pureport list --initiator", "B": "purehost list --connect", "C": "purevol list --connect", "D": "purearray list --port"}, "a": "A", "e": [["p", "D’après l’examen d’exemple FASS, pureport list --initiator renvoie les WWN d’initiateurs hôtes actuellement connectés (logged in) à chaque port cible FC de la baie. C’est l’outil de référence pour diagnostiquer les problèmes de zoning et de login FC."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purehost list --connect affiche les connexions de volumes par hôte, pas les logins d’initiateurs par port FC.", "**C.** purevol list --connect affiche les associations hôte-volume, pas les logins d’initiateurs au niveau des ports.", "**D.** purearray list --port n’est pas une combinaison d’options documentée."]]], "t": "Réseau"}, {"n": 24, "q": "A Linux host using iSCSI to a FlashArray is missing logins on half of its expected paths after a switch reboot, and host-side IOPS have dropped. Which check is the most appropriate first step from the array side?", "o": {"A": "Validate ESXi PSP/SATP claim rules in /etc/vmware", "B": "Run pureport list to confirm the array sees the host IQN logged into both controllers' iSCSI ports", "C": "Reseat the NVRAM module on CT0", "D": "Disable SafeMode on the protection group"}, "a": "B", "e": [["p", "Une baisse d’IOPS côté hôte avec des logins inégaux est un scénario de dépannage de performance. Depuis la baie, pureport list (ou purehost list --connect) confirme que l’IQN de l’hôte est connecté aux deux contrôleurs et au nombre attendu de ports cibles. Des logins inégaux orientent vers le zoning, le VLAN ou les ACL du commutateur, ou vers la configuration des sessions iSCSI de l’hôte."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Les règles PSP/SATP sont propres à VMware ; ce scénario décrit un hôte Linux.", "**C.** Réenficher la NVRAM n’a aucun rapport avec la répartition des logins iSCSI.", "**D.** SafeMode n’affecte pas l’établissement des sessions iSCSI."]]], "t": "Performance"}, {"n": 25, "q": "What is the recommended MTU for an iSCSI or NVMe-TCP storage VLAN connecting hosts to a FlashArray, when jumbo frames are supported end-to-end?", "o": {"A": "1500", "B": "4096", "C": "9000", "D": "65535"}, "a": "C", "e": [["p", "Les bonnes pratiques réseau d’Everpure recommandent des jumbo frames avec une MTU de 9000 pour les réseaux de stockage iSCSI et NVMe-TCP lorsque chaque équipement du chemin (carte réseau de l’hôte, commutateurs, port de la baie) les prend en charge. Une incohérence de MTU n’importe où sur le chemin provoque une fragmentation silencieuse et des pics de latence."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** 1500 est la MTU Ethernet par défaut et fonctionne, mais ce n’est pas le réglage jumbo frame recommandé pour les VLAN de stockage.", "**B.** 4096 n’est pas une valeur de MTU standard pour le stockage.", "**D.** 65535 est bien supérieur à toute MTU Ethernet prise en charge."]]], "t": "Réseau"}, {"n": 26, "q": "Which CLI defines a single LACP bond named lacp0 from Ethernet ports 18 and 19 on controller 0 for FA File Virtual Interfaces?", "o": {"A": "purenetwork eth create lacpbond --subinterfacelist ct0.eth18,ct0.eth19 lacp0", "B": "purenetwork ethport create lacpond --subinterfacelist ct0.eth18,ct0.eth19 lacp0", "C": "purenetwork ethernet create lacpbond --subinterfacelist ct0.eth18,ct0.eth19 lacp0", "D": "purenetwork bond create --slaves ct0.eth18,ct0.eth19 lacp0"}, "a": "A", "e": [["p", "D’après l’examen d’exemple FASS, purenetwork eth create lacpbond --subinterfacelist ct0.eth18,ct0.eth19 lacp0 est la forme correcte. Purity//FA accepte la sous-commande « eth » (et non « ethernet » ni « ethport »), et lacpbond est le jeton de type."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** « lacpond » est une faute de frappe et « ethport » n’est pas la bonne sous-commande.", "**C.** « ethernet » n’est pas le bon mot-clé de sous-commande ; c’est « eth ».", "**D.** purenetwork bond create avec --slaves n’est pas une forme documentée de Purity."]]], "t": "Réseau"}, {"n": 27, "q": "An SMB client can only access a FA File export by IP address, never by hostname. Which root cause is most likely?", "o": {"A": "Active Directory domain controller is unreachable", "B": "OpenLDAP authentication is misconfigured", "C": "DNS resolution from the client is broken", "D": "SafeMode is enabled on the file share"}, "a": "C", "e": [["p", "D’après l’exemple du guide d’étude FASS, lorsqu’un client SMB doit utiliser l’adresse IP littérale et ne peut pas utiliser le nom d’hôte du partage, la cause la plus courante est une résolution DNS défaillante entre le client et le nom du VIF FA File. Les problèmes AD/OpenLDAP affecteraient l’authentification, pas la résolution de noms."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Une panne du contrôleur de domaine AD provoque des échecs de connexion, pas un écart nom/IP lors de l’accès au partage.", "**B.** Une mauvaise configuration d’OpenLDAP affecte les recherches d’annuaire, pas la résolution de noms DNS.", "**D.** SafeMode protège les snapshots et la configuration ; il ne bloque pas l’accès par nom d’hôte."]]], "t": "Réseau"}, {"n": 28, "q": "When a FA File Service Virtual Interface (VIF) on the primary controller fails, where does client traffic move?", "o": {"A": "To the standby interface on the primary controller", "B": "To the standby interface on the secondary controller", "C": "To a newly promoted primary controller", "D": "It is dropped until the failed interface returns"}, "a": "A", "e": [["p", "D’après l’examen d’exemple FASS, le basculement d’un VIF (Virtual Interface) FA File se fait d’abord vers une interface de secours (standby) du même contrôleur principal. Le basculement entre contrôleurs est un événement distinct, plus perturbateur ; l’interface de secours par contrôleur préserve autant que possible les sessions NFS/SMB."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Le basculement ne passe pas directement au contrôleur secondaire ; l’interface de secours du même contrôleur est préférée.", "**C.** Promouvoir un nouveau contrôleur principal relève d’un basculement complet de contrôleur, pas de la panne d’un seul VIF.", "**D.** Le trafic n’est pas simplement abandonné ; cela irait à l’encontre de l’objectif de la haute disponibilité de FA File."]]], "t": "Réseau"}, {"n": 29, "q": "A customer reports they cannot ping the ActiveCluster cloud mediator. Which is the most likely cause per Pure documentation?", "o": {"A": "TCP port 122 is blocked on the customer's firewall", "B": "The mediator does not respond to ICMP requests by design", "C": "The mediator certificate has expired", "D": "The mediator load-balances away ICMP for cost reasons"}, "a": "B", "e": [["p", "D’après l’examen d’exemple FASS, le médiateur cloud ActiveCluster ne répond pas à l’ICMP. Un ping en échec ne prouve pas qu’un chemin est rompu ; la baie communique avec le médiateur sur ses ports TCP documentés. Il faut utiliser des vérifications au niveau de la connexion."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Le port 122 n’est pas le port documenté du médiateur ; c’est un leurre.", "**C.** Un certificat expiré apparaîtrait sous forme d’erreurs TLS dans les journaux de la baie, pas d’échecs de ping.", "**D.** Le comportement d’équilibrage de charge de l’ICMP n’est pas la raison documentée."]]], "t": "Réplication"}, {"n": 30, "q": "Which protocol/port assignment is documented in the FlashArray TCP and UDP Port Assignments guide for replication traffic between two FlashArrays in async replication?", "o": {"A": "TCP 80 only", "B": "Dedicated replication TCP ports on each replication interface", "C": "UDP 514 only", "D": "TCP 22 (SSH) only"}, "a": "B", "e": [["p", "La réplication asynchrone entre FlashArray utilise des ports TCP de réplication dédiés sur les interfaces de réplication de chaque baie, comme documenté dans le guide FlashArray TCP and UDP Port Assignments. Les pare-feu entre les baies doivent autoriser ces ports entre les points de terminaison de réplication configurés."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Le port 80 n’est pas utilisé pour la réplication de baie à baie.", "**C.** UDP 514 sert à syslog, pas aux données de réplication.", "**D.** SSH sert à l’administration, pas aux données de réplication."]]], "t": "Réplication"}, {"n": 31, "q": "Which CLI rotates or replaces a Management/SSL certificate on a FlashArray?", "o": {"A": "purecert", "B": "puressl", "C": "purearray cert", "D": "puresecurity cert"}, "a": "A", "e": [["p", "purecert est la CLI de Purity//FA pour gérer les certificats : génération de CSR, import de certificats signés par une autorité de certification, rotation et suppression des certificats expirés. Everpure documente les workflows purecert à la fois pour les certificats Management/SSL et VASA."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** puressl n’est pas une commande de Purity//FA.", "**C.** purearray ne comporte pas de sous-commandes cert.", "**D.** puresecurity n’est pas une commande de Purity//FA."]]], "t": "Réseau"}, {"n": 32, "q": "What is the maximum recommended round-trip latency between two FlashArrays running ActiveCluster (synchronous, active/active)?", "o": {"A": "3 ms RTT", "B": "5 ms RTT", "C": "11 ms RTT", "D": "20 ms RTT"}, "a": "C", "e": [["p", "Everpure documente 11 ms de RTT comme latence aller-retour maximale prise en charge entre deux FlashArray exécutant ActiveCluster. Au-delà de 11 ms, le miroir synchrone entraîne une pénalité de performance supérieure à la protection qu’il apporte."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** 3 ms se situe largement dans la plage prise en charge ; ce n’est pas le maximum.", "**B.** 5 ms se situe largement dans la plage prise en charge.", "**D.** 20 ms dépasse la limite prise en charge et constitue un leurre fréquent."]]], "t": "Réseau"}, {"n": 33, "q": "An async replication CONNECTION between two FlashArrays is failing to establish. Which command shows the connection state and last error reason?", "o": {"A": "purearray connection list", "B": "purehw list --replication", "C": "puredb connection list", "D": "purevol list --connect"}, "a": "A", "e": [["p", "D’après l’examen d’exemple FASS, purearray connection list renvoie chaque connexion de baie distante, son type (sync/async), son état actuel et le dernier message d’erreur. C’est la première commande de référence à exécuter face à une alerte « Unable to connect to remote array »."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purehw liste le matériel, pas les connexions de réplication.", "**C.** puredb sert aux dumps de bas niveau des sous-systèmes, pas à la liste de connexions destinée à l’utilisateur.", "**D.** purevol list --connect affiche les connexions volume-hôte, pas la réplication de baie à baie."]]], "t": "Réplication"}, {"n": 34, "q": "What command lists existing replication targets, schedules, and lag for protection groups?", "o": {"A": "purereplication list", "B": "puredb list replication", "C": "pureprotectiongroup list", "D": "puresnap list --remote"}, "a": "C", "e": [["p", "pureprotectiongroup list avec les options liées à la réplication renvoie le groupe de protection, ses membres, ses cibles de réplication, son planning de rétention et l’état du dernier transfert. C’est la vue de référence pour la santé de la réplication asynchrone par groupe de protection."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** purereplication n’est pas la commande de premier niveau de référence de Purity//FA pour l’état de réplication des groupes de protection.", "**B.** puredb list replication est une vue de diagnostic de bas niveau, pas une vue destinée à l’utilisateur.", "**D.** puresnap list --remote affiche des snapshots, pas les plannings de réplication des groupes de protection."]]], "t": "Réplication"}, {"n": 35, "q": "A 'Protection Group Disallowed' alert was raised after repeated network failures. Which workflow correctly resolves it?", "o": {"A": "Delete the protection group and create a new one with the same name on the source array", "B": "Resolve the network issue, then re-allow the protection group from the source array", "C": "Resolve the network issue, then re-allow the protection group from the target array", "D": "Wait 24 hours for Pure1 to auto-clear the alert"}, "a": "C", "e": [["p", "D’après l’examen d’exemple FASS, lorsqu’une défaillance réseau répétée place un groupe de protection à l’état « disallowed », la bonne solution consiste d’abord à résoudre le problème réseau sous-jacent, puis à ré-autoriser (re-allow) le groupe de protection sur la baie cible (c’est elle qui l’a bloqué). Le ré-autoriser sur la source ne lève pas le blocage côté cible."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Supprimer puis recréer fait perdre l’historique de réplication et n’est pas la correction documentée.", "**B.** Ré-autoriser sur la source ne lève pas le blocage qui se trouve sur la cible.", "**D.** Pure1 ne lève pas automatiquement les états « disallowed » des groupes de protection ; une action d’administrateur est nécessaire."]]], "t": "Réplication"}, {"n": 36, "q": "Why does ActiveDR (Near-Zero RPO) not guarantee a specific RPO?", "o": {"A": "ActiveDR is a secondary process, and front-end I/O performance is prioritized over replication", "B": "ActiveDR enforces a strict per-volume RPO that cannot be exceeded", "C": "ActiveDR is synchronous and therefore has 0 RPO", "D": "ActiveDR uses CloudSnap, which only supports daily granularity"}, "a": "A", "e": [["p", "D’après l’examen d’exemple FASS, ActiveDR est asynchrone et traite la réplication comme une charge secondaire derrière les E/S frontales. Lorsque la charge de travail augmente ou que le réseau est contraint, le retard (lag) s’accroît ; c’est pourquoi Everpure parle de « Near-Zero RPO » plutôt que d’un engagement de RPO fixe."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** ActiveDR n’impose pas de RPO fixe ; il suit le retard.", "**C.** ActiveDR est asynchrone ; c’est ActiveCluster qui est synchrone (RPO nul).", "**D.** ActiveDR ne dépend pas de CloudSnap."]]], "t": "Réplication"}, {"n": 37, "q": "ActiveDR organizes replicated volumes into which top-level Purity construct?", "o": {"A": "Protection groups", "B": "Pods", "C": "Host groups", "D": "Volume groups"}, "a": "B", "e": [["p", "ActiveDR repose sur les pods : un pod est l’unité qui se réplique de la baie source vers la baie cible, les opérations de promotion/rétrogradation étant effectuées sur le pod. Les groupes de protection servent à la réplication asynchrone classique, pas à ActiveDR."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Les groupes de protection sont l’unité de la réplication asynchrone, pas d’ActiveDR.", "**C.** Les groupes d’hôtes relèvent du contrôle d’accès, ils ne sont pas une unité de réplication.", "**D.** Les groupes de volumes organisent les volumes pour la gestion ; ActiveDR réplique des pods."]]], "t": "Réplication"}, {"n": 38, "q": "A Support Specialist must demote a source ActiveDR pod for a planned migration without losing data. What must be confirmed before demotion?", "o": {"A": "All hosts have been disconnected from the array", "B": "The replication link has caught up so the target pod has all writes", "C": "The source array has been rebooted", "D": "SafeMode has been disabled on every snapshot"}, "a": "B", "e": [["p", "D’après le guide d’étude FASS, pour éviter toute perte de données lors de la rétrogradation d’un lien de réplica source, le Specialist doit vérifier que le lien de réplication est entièrement à jour avant de rétrograder ; sinon, les écritures en cours qui ne sont pas encore répliquées vers la cible ne seront pas appliquées sur le nouveau primaire."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Il n’est pas nécessaire de déconnecter les hôtes ; l’objectif est un basculement non disruptif.", "**C.** Redémarrer la baie source n’est pas un prérequis.", "**D.** Désactiver SafeMode n’est pas sûr et n’a aucun rapport avec la rétrogradation ActiveDR."]]], "t": "Réplication"}, {"n": 39, "q": "What is the difference between ActiveCluster and ActiveDR in terms of host I/O behavior?", "o": {"A": "ActiveCluster is synchronous and active/active across both arrays; ActiveDR is asynchronous with promote/demote", "B": "ActiveCluster is asynchronous and active/active; ActiveDR is synchronous", "C": "Both are synchronous; ActiveDR uses CloudSnap as transport", "D": "Both are asynchronous; ActiveCluster uses pods and ActiveDR uses protection groups"}, "a": "A", "e": [["p", "ActiveCluster est actif/actif synchrone : le même volume est en lecture-écriture simultanément sur les deux baies, un médiateur empêchant le split-brain. ActiveDR est asynchrone : les pods se répliquent avec un Near-Zero RPO, avec des workflows de promotion/rétrogradation pour le basculement."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** ActiveCluster est synchrone ; ActiveDR est asynchrone.", "**C.** ActiveDR n’utilise pas CloudSnap.", "**D.** ActiveCluster utilise bien des pods, mais il est synchrone, pas asynchrone."]]], "t": "Réplication"}, {"n": 40, "q": "What backup pattern does CloudSnap follow when offloading FlashArray snapshots to a target?", "o": {"A": "Only full backups every cycle", "B": "Only incremental backups (no baseline)", "C": "An initial full backup, followed by incremental backups", "D": "Mirrored synchronous writes to the cloud"}, "a": "C", "e": [["p", "D’après l’examen d’exemple FASS, CloudSnap envoie d’abord une sauvegarde complète initiale des données de snapshot vers la cible, puis envoie les modifications incrémentielles à chaque snapshot suivante. Cela minimise la bande passante sortante tout en conservant la restauration à un instant donné."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Du tout-complet à chaque fois multiplierait le trafic sortant ; ce n’est pas le fonctionnement de CloudSnap.", "**B.** Sans point de référence (baseline), les incrémentielles ne peuvent pas être appliquées lors d’une restauration.", "**D.** CloudSnap n’est pas synchrone ; c’est une réplication de snapshots de type déport (offload)."]]], "t": "Réplication"}, {"n": 41, "q": "A Support Specialist sees the following in core.log: 'driver stall for user IO write 32768b cmd_to_alloc:4us alloc_buf:0us alloc_done_to_exec:238340us exec_done_to_dropoff:4us'. Which latency category does this output point to?", "o": {"A": "SAN latency", "B": "Service latency", "C": "Queue latency", "D": "Cache latency"}, "a": "A", "e": [["p", "D’après l’examen d’exemple FASS, lorsque alloc_done_to_exec domine (ici environ 238 ms contre des microsecondes ailleurs), l’hôte met longtemps à remplir le tampon que la baie a déjà alloué. Il s’agit d’une latence côté SAN (hôte ou fabric), pas du temps de service de la baie."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** La latence de service se manifesterait dans cmd_to_alloc ou dans des étapes internes à la baie, pas dans alloc_done_to_exec.", "**C.** La latence de file (queue) est une catégorie distincte de cette étape de driver stall.", "**D.** Une latence liée au cache apparaîtrait à d’autres étapes du pipeline d’écriture."]]], "t": "Performance"}, {"n": 42, "q": "What does the alloc_done_to_exec driver stage actually measure?", "o": {"A": "Time taken for the FlashArray to execute the buffer", "B": "Time taken for the host to fill the buffer the array has allocated", "C": "Time taken for the host to receive the buffer", "D": "Time taken to acknowledge the write to the host"}, "a": "B", "e": [["p", "D’après l’examen d’exemple FASS, alloc_done_to_exec mesure le temps écoulé entre le moment où la FlashArray a alloué un tampon d’écriture et celui où l’hôte l’a effectivement rempli. Des valeurs élevées désignent des problèmes d’hôte ou de fabric (slow drain, congestion, manque de CPU de l’hôte), pas la baie."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** L’exécution côté baie est mesurée à d’autres étapes du pipeline.", "**C.** Le temps de réception du tampon est une étape distincte.", "**D.** L’acquittement de l’écriture est mesuré séparément, pas dans alloc_done_to_exec."]]], "t": "Performance"}, {"n": 43, "q": "Pure1 dashboards report sustained high write latency on a single FlashArray volume while every other volume is healthy. Which root cause is most consistent with this signature?", "o": {"A": "Array NVRAM exhaustion across the entire array", "B": "A noisy-neighbor host pushing the volume past a QoS bandwidth/IOPS limit", "C": "An expired Management/SSL certificate", "D": "A failed shelf cable to a DirectFlash shelf"}, "a": "B", "e": [["p", "Lorsque la latence est élevée sur un seul volume alors que le reste de la baie est sain, le schéma est propre au volume : un voisin bruyant (noisy neighbor) ou une limite QoS appliquée à ce volume / groupe d’hôtes. Des problèmes touchant toute la baie (NVRAM, câble de tiroir) affecteraient tous les volumes."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Une saturation de la NVRAM affecterait toutes les écritures de la baie, pas un seul volume.", "**C.** Les problèmes de certificat n’augmentent pas la latence du chemin de données.", "**D.** Les défaillances de câble de tiroir dégradent de nombreux volumes partageant ce tiroir."]]], "t": "Performance"}, {"n": 44, "q": "Which command applies a 200 MB/s bandwidth limit to a host group named app_hg using QoS?", "o": {"A": "purehgroup setattr --bandwidth-limit 200M app_hg", "B": "purehgroup limit set --bw 200M app_hg", "C": "purearray qos --hgroup app_hg --bw 200M", "D": "purevol setattr --hgroup app_hg --bw 200M"}, "a": "A", "e": [["p", "purehgroup setattr --bandwidth-limit 200M applique un plafond de bande passante QoS à un groupe d’hôtes, ce qui est la méthode standard pour brider un voisin bruyant sans toucher aux volumes individuels. Les limites d’IOPS utilisent --iops-limit sur la même commande."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purehgroup limit set n’est pas la forme documentée.", "**C.** purearray qos n’est pas une sous-commande valide de Purity//FA.", "**D.** purevol setattr applique des attributs aux volumes, pas aux groupes d’hôtes."]]], "t": "Performance"}, {"n": 45, "q": "What does Pure Storage QoS rate limiting actually constrain on a FlashArray?", "o": {"A": "Only physical capacity used by the volume", "B": "Bandwidth and/or IOPS available to the targeted volume or host group", "C": "The number of snapshot copies a protection group can hold", "D": "The number of replication targets a connection can have"}, "a": "B", "e": [["p", "D’après la FAQ QoS, la limitation de débit QoS de FlashArray borne la bande passante (Mo/s) et/ou les IOPS d’un volume ou d’un groupe d’hôtes donné. Elle ne modifie ni la capacité, ni le nombre de snapshots, ni la topologie de réplication ; elle ne fait que freiner le chemin de données."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** La capacité est régie par le provisionnement, pas par la QoS.", "**C.** La rétention des snapshots est définie par pureschedule, pas par la QoS.", "**D.** La topologie de réplication se configure séparément."]]], "t": "Performance"}, {"n": 46, "q": "A Linux host running FC multipathing sees uneven latency across paths to a FlashArray. Which host-side parameter is most commonly tuned per Pure best practice?", "o": {"A": "device-mapper rr_min_io and path_grouping_policy", "B": "ext4 journal_async_commit", "C": "TCP rmem/wmem buffer sizes", "D": "iSCSI noop_out_interval"}, "a": "A", "e": [["p", "Pour le multipath FC sous Linux face à une FlashArray, Everpure recommande des réglages de device-mapper-multipath tels que path_grouping_policy multibus et un ajustement de rr_min_io afin que les E/S soient réparties uniformément sur les chemins actifs. Cela évite qu’un chemin porte une charge disproportionnée."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Les options de journal d’ext4 influencent le comportement du système de fichiers, pas l’équilibrage des chemins multipath.", "**C.** Les tampons TCP concernent iSCSI/NVMe-TCP, pas FC.", "**D.** noop_out_interval est propre à iSCSI."]]], "t": "Performance"}, {"n": 47, "q": "On VMware ESXi connected to a FlashArray, which Path Selection Policy (PSP) does Pure recommend for FlashArray volumes?", "o": {"A": "VMW_PSP_MRU", "B": "VMW_PSP_FIXED", "C": "VMW_PSP_RR (Round Robin)", "D": "VMW_PSP_LB"}, "a": "C", "e": [["p", "Le guide de bonnes pratiques VMware d’Everpure spécifie VMW_PSP_RR (Round Robin) comme PSP pour les volumes FlashArray, associé à la règle de claim SATP qui fixe IOPS=1 pour une utilisation optimale des chemins. MRU et FIXED laissent du débit inexploité."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** MRU ne répartit pas activement les E/S sur les chemins.", "**B.** FIXED s’épingle sur un seul chemin préféré et laisse les autres inactifs.", "**D.** VMW_PSP_LB n’est pas un PSP standard d’ESXi."]]], "t": "Performance"}, {"n": 48, "q": "A Specialist needs to investigate latency caused by lookaside cache usage on a FlashArray. Which doc-aligned diagnostic technique is most relevant?", "o": {"A": "Run pureconfig and grep for SafeMode entries", "B": "Use FA tools and timeline logs to inspect backend stages including lookaside cache hits/misses", "C": "Disable Pure1 telemetry to remove sampling overhead", "D": "Restart the OpenMetrics Exporter"}, "a": "B", "e": [["p", "D’après l’objectif FASS sur la supervision, une latence causée par des opérations backend telles que l’usage du lookaside cache s’analyse avec les FA tools et les journaux de timeline, qui exposent les étapes internes. SafeMode et la télémétrie Pure1 n’ont aucun rapport avec ce diagnostic."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** pureconfig collecte des données de support ; il ne fait pas apparaître les statistiques du lookaside cache.", "**C.** L’échantillonnage de la télémétrie Pure1 ne provoque pas de latence mesurable sur le chemin de données.", "**D.** Redémarrer l’OpenMetrics Exporter ne modifie pas le comportement de la latence de la baie."]]], "t": "Performance"}, {"n": 49, "q": "Which Pure tool exports performance metrics in a Prometheus-friendly format that customers can scrape from outside Pure1?", "o": {"A": "FlashArray OpenMetrics Exporter", "B": "Pure1 Edge Collector", "C": "fa dump bundle", "D": "pureconfig log"}, "a": "A", "e": [["p", "Le FlashArray OpenMetrics Exporter expose les métriques de la baie au format OpenMetrics/Prometheus, ce qui permet aux clients d’intégrer la latence, les IOPS et la capacité de la FlashArray à leurs propres piles d’observabilité, en complément de Pure1."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Pure1 Edge Collector n’est pas le point de terminaison OpenMetrics que les clients interrogent directement.", "**C.** fa dump bundle crée un lot de journaux de support, pas un point de terminaison de métriques en direct.", "**D.** pureconfig log est un dump de configuration/journaux, pas un point de terminaison de métriques."]]], "t": "Performance"}, {"n": 50, "q": "On the FlashArray GUI, which statistic most directly indicates a noisy-neighbor host saturating front-end ports?", "o": {"A": "Array used capacity %", "B": "Per-host latency and bandwidth top-talker view", "C": "Snapshot eradication count", "D": "Replication CONNECTION uptime"}, "a": "B", "e": [["p", "La vue de latence et de bande passante par hôte de l’interface graphique classe les hôtes selon leur charge actuelle. Un seul hôte en tête de liste alors que les autres sont plats est la signature classique d’un voisin bruyant, et permet au Specialist de cibler cet hôte avec des corrections QoS ou de zoning."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** La capacité utilisée de la baie n’indique pas la charge par hôte.", "**C.** Le nombre d’éradications de snapshots n’a aucun rapport avec les performances en direct.", "**D.** La disponibilité de la CONNECTION indique la santé de la réplication, pas les E/S des hôtes."]]], "t": "Performance"}, {"n": 51, "q": "Which CLI is documented as the canonical way to assemble a Pure Support log bundle on a FlashArray?", "o": {"A": "pureconfig", "B": "purebundle", "C": "purelog dump", "D": "puresupport collect"}, "a": "A", "e": [["p", "pureconfig (avec des sous-commandes telles que pureconfig list, save et les workflows de lot de support sous fa tools) est documenté pour capturer la configuration et les journaux d’un cas ouvert auprès du support Everpure. Le lot est ensuite téléversé via le workflow du support."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purebundle n’est pas une commande de Purity//FA.", "**C.** purelog dump n’est pas la forme documentée.", "**D.** puresupport collect n’est pas une vraie commande de Purity//FA."]]], "t": "Performance"}, {"n": 52, "q": "A FlashArray reports a sudden spike in 'system space' shortly after a large VM migration finished, and that space disappears a few hours later. Which is the most likely cause?", "o": {"A": "The FlashArray was unable to clean up reclaimable space fast enough to keep up with the migration workload", "B": "The FlashArray had not yet categorized the newly written data", "C": "The FlashArray had not yet completed RAID and pyramid space allocation", "D": "The FlashArray was running a SafeMode integrity scan"}, "a": "B", "e": [["p", "D’après l’examen d’exemple FASS, ce pic transitoire de « system space » se produit parce que la baie n’avait pas encore catégorisé les données nouvellement écrites dans les bons compartiments comptables. Une fois la catégorisation terminée par Purity, le « system space » temporaire est reclassé et disparaît."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Un retard de récupération d’espace ne se résoudrait pas simplement en attendant ; il faudrait que la charge de travail diminue.", "**C.** L’allocation RAID/pyramid est un compartiment à part et n’apparaît pas comme un pic transitoire de system space de ce type.", "**D.** Les contrôles d’intégrité de SafeMode ne provoquent pas de pics transitoires de system space."]]], "t": "Performance"}, {"n": 53, "q": "A FlashArray fires 'Alert 5002 - CTIO Timeout' against an FC port. What does this signal?", "o": {"A": "A host or fabric is failing to deliver a Fibre Channel I/O within the array's expected window", "B": "An NVRAM module has lost charge", "C": "The DNS resolver returned NXDOMAIN for the array hostname", "D": "A protection group exceeded its retention limit"}, "a": "A", "e": [["p", "L’alerte 5002 (CTIO Timeout) est une alerte de performance/timeout Fibre Channel : la baie a émis un CTIO (Continue I/O) mais n’a pas vu l’hôte ou le fabric le terminer dans la fenêtre attendue. On l’analyse avec les vérifications de slow drain et de zoning FC."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Les problèmes de charge de la NVRAM déclenchent l’alerte 5056, pas la 5002.", "**C.** Les problèmes DNS ne déclenchent pas de CTIO timeout.", "**D.** La rétention des groupes de protection n’a aucun rapport avec CTIO."]]], "t": "Performance"}, {"n": 54, "q": "A switch port connected to an ESXi host repeatedly reports buffer-credit zero events and the FlashArray sees CTIO timeouts. Which industry term and root cause should be investigated?", "o": {"A": "Slow drain caused by a host that is not pulling frames fast enough, draining FC switch buffer credits", "B": "TCP retransmissions caused by NVMe-TCP MTU mismatch", "C": "Snapshot eradication storm", "D": "BGP route flap on the management VLAN"}, "a": "A", "e": [["p", "Le slow drain FC se produit lorsqu’un hôte ne peut pas consommer les trames au débit nominal, ce qui épuise les crédits de tampon (buffer credits) du commutateur. Cela exerce une contre-pression sur les autres initiateurs du même fabric et apparaît souvent sur la baie sous forme de CTIO timeouts. Everpure documente ce cas comme un scénario principal de dépannage FC."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Les problèmes de MTU/NVMe-TCP concernent Ethernet, pas les crédits de tampon FC.", "**C.** L’éradication de snapshots ne consomme pas de crédits de tampon FC.", "**D.** BGP sur le VLAN de gestion n’a aucun rapport avec le slow drain du fabric FC."]]], "t": "Performance"}, {"n": 55, "q": "Which specific FlashArray alert covers a delayed protection-group replication?", "o": {"A": "Alert 51 - Protection Group Replication Delayed", "B": "Alert 73 - Chassis Manager Mastership Failure", "C": "Alert 5056 - NVRAM Undercharged", "D": "Alert 10036 - Excessive Pinned Space"}, "a": "A", "e": [["p", "L’alerte 51 se déclenche lorsque la réplication d’un groupe de protection est retardée au-delà des seuils attendus. Everpure la documente dans le guide FlashArray Asynchronous Replication Configuration and Best Practices, avec les étapes pour examiner le réseau et la configuration du groupe de protection."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** L’alerte 73 concerne la mastership du chassis manager.", "**C.** L’alerte 5056 concerne une NVRAM sous-chargée.", "**D.** L’alerte 10036 concerne un espace épinglé excessif (pinned space)."]]], "t": "Réplication"}, {"n": 56, "q": "Which Purity
