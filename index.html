//FA versions are the latest exam questions written against, per the FASS study guide preface?", "o": {"A": "Purity//FA 5.3.x and Purity//FB 3.x", "B": "Purity//FA 6.6.x and Purity//FB 4.0.x", "C": "Purity//FA 6.9.x and Purity//FB 4.5.x", "D": "Purity//FA 7.0.x and Purity//FB 5.0.x"}, "a": "C", "e": [["p", "Le guide d’étude FASS indique explicitement que les dernières questions sont rédigées pour Purity//FA 6.9.x et Purity//FB 4.5.x. Les questions existantes des versions antérieures restent dans le jeu tant que leur contenu s’applique encore."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** 5.3.x est très en retrait par rapport à la version documentée.", "**B.** 6.6.x est citée pour certains sous-objectifs, mais pas comme dernière cible.", "**D.** 7.0.x n’est pas la version actuelle documentée pour l’examen."]]], "t": "Logiciel"}, {"n": 57, "q": "While troubleshooting cluster-wide write latency, a Specialist needs to verify that two hosts in a Linux cluster see the same FlashArray volume by checking matching device WWIDs. Which Purity//FA-side identifier maps to a host-visible WWID?", "o": {"A": "Volume serial number reported by purevol list", "B": "Host group name", "C": "Protection group ID", "D": "Pure1 array ID"}, "a": "A", "e": [["p", "Le numéro de série du volume affiché par purevol list est ce que l’hôte voit dans son WWID multipath. Confirmer le même numéro de série sur les deux hôtes est le contrôle de référence, côté performance/HA, pour s’assurer que deux nœuds du cluster voient bien le même volume sur la baie."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Les noms de groupes d’hôtes relèvent de l’organisation côté baie, pas des WWID.", "**C.** Les ID de groupes de protection ne sont pas des WWID d’hôte.", "**D.** L’ID de baie Pure1 identifie la baie elle-même, pas un volume."]]], "t": "Performance"}, {"n": 58, "q": "A FlashArray volume is to be replicated to a remote array through async replication. Which object is created first to define the link between the two arrays?", "o": {"A": "A protection group on the source array", "B": "An array-to-array CONNECTION object", "C": "A pod on the target array", "D": "A host group on the target array"}, "a": "B", "e": [["p", "La réplication asynchrone commence par un objet CONNECTION de baie à baie, qui authentifie et configure le lien entre la source et la cible. Une fois la connexion saine, on crée un groupe de protection sur la source et on y ajoute la baie cible comme cible de réplication."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Le groupe de protection est créé après l’existence de la CONNECTION ; il en dépend.", "**C.** Les pods relèvent d’ActiveDR/ActiveCluster, ils ne sont pas le prérequis de la réplication asynchrone.", "**D.** Les groupes d’hôtes n’ont aucun rapport avec le lien de réplication source/cible."]]], "t": "Réplication"}, {"n": 59, "q": "Which Purity//FA construct must be configured on both arrays in an ActiveCluster pair to prevent split-brain during a network partition?", "o": {"A": "A SafeMode key vault", "B": "A mediator (cloud or on-premises)", "C": "A protection group with snapshot retention", "D": "An OpenMetrics exporter"}, "a": "B", "e": [["p", "ActiveCluster exige un médiateur (médiateur cloud hébergé par Everpure ou médiateur sur site) pour arbitrer lors d’une partition réseau. Le réglage de baie préférée (preferred array) indique au médiateur quel côté doit continuer à servir les E/S si la connectivité avec le médiateur est perdue."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** SafeMode protège les snapshots, il n’assure pas l’arbitrage du cluster.", "**C.** Les groupes de protection sont des objets de réplication asynchrone, pas des arbitres de cluster.", "**D.** L’OpenMetrics exporter sert à la supervision."]]], "t": "Réplication"}, {"n": 60, "q": "What is the role of the 'preferred array' setting in an ActiveCluster pair?", "o": {"A": "It selects which array compresses data on writes", "B": "It tells the mediator which array continues serving I/O if mediator connectivity is lost", "C": "It pins replication snapshots to one site", "D": "It determines which array runs CloudSnap"}, "a": "B", "e": [["p", "Lorsque le médiateur devient injoignable pendant une partition, le réglage de baie préférée d’ActiveCluster détermine quelle baie continue de servir les E/S des hôtes pendant que l’autre passe en lecture seule. Sans baie préférée, les deux côtés pourraient perdre l’accès afin d’éviter un split-brain."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** La compression est toujours active ; elle n’est pas arbitrée.", "**C.** La réplication de snapshots est indépendante du réglage de baie préférée.", "**D.** Le fonctionnement de CloudSnap ne dépend pas de la baie préférée."]]], "t": "Réplication"}, {"n": 61, "q": "What is an ActiveCluster 'pre-election'?", "o": {"A": "A scheduled job that pre-selects the next Purity firmware version", "B": "An optimization that lets the cluster decide a winner faster when a partition occurs", "C": "A pre-stage step for snapshot eradication", "D": "A pre-flight check for CloudSnap"}, "a": "B", "e": [["p", "La fonction Pre-Election d’ActiveCluster permet au cluster de décider à l’avance quelle baie l’emporterait lors d’une partition avant même que celle-ci ne survienne, de sorte qu’en cas de défaillance réelle la bascule des E/S soit plus rapide et plus déterministe."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Elle n’a aucun rapport avec les versions de firmware.", "**C.** L’éradication de snapshots est régie par SafeMode et par les actions des administrateurs.", "**D.** Elle n’a rien à voir avec les contrôles préalables de CloudSnap."]]], "t": "Réplication"}, {"n": 62, "q": "Which authentication source can be configured for Purity//FA admin login?", "o": {"A": "LDAP/Active Directory and SAML SSO with optional MFA", "B": "Local accounts only; no remote auth is supported", "C": "RADIUS only", "D": "Kerberos only"}, "a": "A", "e": [["p", "Purity//FA prend en charge les comptes locaux ainsi que les services d’annuaire LDAP/Active Directory et le SSO basé sur SAML, avec MFA disponible. Le RBAC se superpose à cela, de sorte que les groupes d’annuaire sont associés aux rôles Array/Storage/Ops Admin."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Les comptes locaux ne sont pas la seule option ; LDAP et SAML sont pris en charge.", "**C.** RADIUS n’est pas le chemin d’authentification documenté.", "**D.** Kerberos est utilisé par FA File pour NFSv4.1, pas pour la connexion des administrateurs."]]], "t": "Logiciel"}, {"n": 63, "q": "How does Pure FA File use Kerberos for NFSv4.1 access?", "o": {"A": "It encrypts every TCP segment using IPSec keys derived from Kerberos", "B": "It authenticates clients to the export so NFSv4.1 sec=krb5 / krb5i / krb5p sessions are validated", "C": "It rotates SafeMode keys every 24 hours", "D": "It signs ActiveCluster mediator messages"}, "a": "B", "e": [["p", "FA File prend en charge NFSv4.1 avec Kerberos sec=krb5 (authentification), krb5i (intégrité) et krb5p (confidentialité). Everpure publie un guide de configuration qui détaille l’intégration de la baie à un KDC et l’association des exports au mode sec approprié."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Ici, Kerberos sert à l’authentification NFS, pas à IPSec.", "**C.** SafeMode est indépendant de Kerberos.", "**D.** La sécurité du médiateur ActiveCluster n’est pas gérée par Kerberos."]]], "t": "Réseau"}, {"n": 64, "q": "What is the documented purpose of the upgrade script that Pure provides for Purity//FA upgrades?", "o": {"A": "To check compatibility and system readiness before applying a new Purity version", "B": "To force an immediate failover regardless of health", "C": "To rotate certificates", "D": "To rebuild parity on every drive"}, "a": "A", "e": [["p", "Le script de mise à niveau vérifie la compatibilité et l’état de préparation du système (NVRAM, santé des disques, état de la paire de contrôleurs, prérequis logiciels) avant une mise à niveau de Purity//FA. Il fait remonter des problèmes comme l’alerte 5056 (NVRAM Undercharged) ou une dégradation du write group avant qu’ils ne provoquent un échec de mise à niveau."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Le script se limite à vérifier la préparation, en lecture seule ; il ne force aucun basculement.", "**C.** La rotation des certificats est gérée par purecert.", "**D.** Les reconstructions de parité sont des opérations d’arrière-plan, non pilotées par le script de mise à niveau."]]], "t": "Logiciel"}, {"n": 65, "q": "What is a Purity//FA write group, and why does its quorum matter?", "o": {"A": "It is the set of NVRAM and flash modules whose redundancy is needed to safely acknowledge writes; loss of quorum forces protective measures", "B": "It is the set of admin users with write access on the GUI", "C": "It is a snapshot retention set", "D": "It is a list of replication targets"}, "a": "A", "e": [["p", "Un write group est l’ensemble des modules NVRAM et DirectFlash dont la santé et le quorum sont nécessaires pour que Purity acquitte les écritures des hôtes en toute sécurité. Si le write group perd son quorum, Purity passe dans un état protecteur afin de ne pas acquitter des écritures qui pourraient être perdues."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Les write groups ne sont pas un concept de permissions utilisateur.", "**C.** La rétention des snapshots est régie par pureschedule, pas par les write groups.", "**D.** Les cibles de réplication sont configurées via des objets CONNECTION."]]], "t": "Performance"}, {"n": 66, "q": "Which statement about FlashArray File and SMB authentication is correct per Pure best practice?", "o": {"A": "Use anonymous binds to AD whenever possible", "B": "Bind the array to AD using an account dedicated to FA File and avoid expired credentials", "C": "Disable TLS on LDAP traffic to simplify troubleshooting", "D": "Use a personal admin account so each engineer can audit changes"}, "a": "B", "e": [["p", "Everpure recommande un compte de service AD dédié à FA File, afin que les changements de mot de passe d’ingénieurs individuels ne cassent pas silencieusement l’authentification SMB. Les liaisons anonymes ne sont pas sûres, et les comptes personnels provoquent des pannes d’authentification lorsque ces utilisateurs quittent l’entreprise."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Les liaisons anonymes sont explicitement déconseillées.", "**C.** Désactiver TLS pour LDAP affaiblit la sécurité et n’est pas recommandé.", "**D.** Les comptes personnels provoquent des pannes lors des changements d’identifiants."]]], "t": "Logiciel"}, {"n": 67, "q": "How can a Specialist tell whether SafeMode is currently enabled on a FlashArray's snapshots?", "o": {"A": "Check the SafeMode setting via purearray/SafeMode CLI or the GUI Settings panel", "B": "Look at NVRAM charge level", "C": "Run pureport list --initiator", "D": "Check FA File audit logs"}, "a": "A", "e": [["p", "L’état de SafeMode apparaît dans le panneau Settings de l’interface graphique et via la CLI spécifique à SafeMode sous purearray. Comme la désactivation de SafeMode exige le support Everpure, confirmer simplement son état actuel est un contrôle de routine lors d’un cas matériel ou de réplication."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** La charge de la NVRAM n’a aucun rapport avec l’état de SafeMode.", "**C.** pureport affiche les logins des ports FC, pas SafeMode.", "**D.** Les journaux d’audit de FA File couvrent les événements des protocoles de fichiers, pas SafeMode."]]], "t": "Logiciel"}, {"n": 68, "q": "Which scenario requires opening a Pure Support case rather than self-service?", "o": {"A": "Listing volumes with purevol list", "B": "Disabling SafeMode on a protection group", "C": "Creating a new host group", "D": "Taking an on-demand puresnap"}, "a": "B", "e": [["p", "Par conception, désactiver SafeMode (ou éradiquer des snapshots protégées par SafeMode) exige l’intervention du support Everpure. C’est ce qui rend SafeMode efficace contre les ransomware : même des identifiants d’administrateur compromis ne peuvent pas supprimer les copies protégées sans qu’Everpure soit en ligne."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Lister les volumes est une opération en lecture seule, en libre-service.", "**C.** Créer des groupes d’hôtes est une action d’administration normale.", "**D.** Les snapshots à la demande sont une action courante, en libre-service."]]], "t": "Logiciel"}, {"n": 69, "q": "Which Pure Storage feature is always enabled and cannot be disabled by the admin on Purity//FA?", "o": {"A": "Always-on data reduction (dedup + compression)", "B": "ActiveCluster", "C": "CloudSnap", "D": "Pod-based ActiveDR"}, "a": "A", "e": [["p", "La réduction de données permanente de la FlashArray (déduplication et compression) ne peut pas être désactivée ; elle fait partie du chemin de données. ActiveCluster, CloudSnap et ActiveDR sont des fonctions optionnelles qu’il faut configurer."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** ActiveCluster est optionnel et se configure par pod.", "**C.** CloudSnap est optionnel.", "**D.** ActiveDR est optionnel."]]], "t": "Logiciel"}, {"n": 70, "q": "What is the canonical CLI for snapshot eradication on a FlashArray, and why is it gated by SafeMode?", "o": {"A": "purevol destroy + purevol eradicate; SafeMode delays/blocks eradication so ransomware can't wipe recoverable copies", "B": "puresnap purge; SafeMode is irrelevant", "C": "purearray erase; SafeMode auto-runs eradication", "D": "puredb eradicate; SafeMode replaces it"}, "a": "A", "e": [["p", "purevol destroy place le volume/la snapshot dans un compartiment « détruit », et purevol eradicate le supprime définitivement. SafeMode ajoute une fenêtre de délai et exige le support Everpure pour éradiquer réellement, de sorte qu’un attaquant disposant d’identifiants volés ne puisse pas simplement effacer des snapshots récupérables."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** puresnap purge n’est pas la forme documentée, et SafeMode est tout à fait pertinent.", "**C.** purearray erase n’est pas la commande d’éradication de snapshots.", "**D.** puredb n’est pas le chemin d’éradication destiné à l’utilisateur."]]], "t": "Logiciel"}, {"n": 71, "q": "What command lists current and historical replication transfer rates between two FlashArrays for a protection group?", "o": {"A": "pureprotectiongroup list --replication-bandwidth", "B": "purearray list --bandwidth", "C": "purehw list --replication", "D": "purevol list --replication"}, "a": "A", "e": [["p", "pureprotectiongroup list avec --replication-bandwidth (ou les options de monitoring équivalentes) renvoie les débits de transfert de réplication observés pour le groupe de protection. On l’associe aux FA tools pour déterminer si les ralentissements de réplication viennent du réseau ou de la baie."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** purearray list n’affiche pas la bande passante de réplication.", "**C.** purehw list indique les composants matériels, pas les débits de réplication.", "**D.** purevol list n’agrège pas les données de transfert de réplication par groupe de protection."]]], "t": "Performance"}, {"n": 72, "q": "Which CLI subcommand structure manages array-to-array authentication keys / connection keys for replication setup?", "o": {"A": "purearray connection", "B": "puresecurity replication", "C": "puredb auth", "D": "purehost connection"}, "a": "A", "e": [["p", "La famille de commandes purearray connection (list, create, delete, génération de clé de connexion) est celle qui associe deux FlashArray pour la réplication asynchrone. La clé de connexion d’une baie est consommée par sa pair pour établir la réplication authentifiée."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** puresecurity n’est pas une commande de Purity//FA.", "**C.** puredb sert aux diagnostics internes.", "**D.** purehost connection concerne les hôtes, pas les baies."]]], "t": "Réplication"}, {"n": 73, "q": "On the FlashArray GUI, where would a Specialist locate a sudden change in capacity or 'system space' after a workload event?", "o": {"A": "Health > Hardware > NVRAM", "B": "Capacity dashboard, including the Pinned Space and System Space breakdowns", "C": "Settings > Network > VIFs", "D": "Hosts > Connected Volumes"}, "a": "B", "e": [["p", "Le tableau de bord Capacity de l’interface graphique répartit la capacité totale utilisée entre volumes, snapshots, espace partagé et system space, y compris les compartiments pinned et reclaimable. Les changements soudains y apparaissent en premier ; les FA tools et la sortie timeline-space permettent d’aller plus loin."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Le panneau NVRAM concerne la redondance du cache, pas les compartiments de capacité.", "**C.** Les VIF sont des interfaces réseau, sans rapport avec la comptabilité de l’espace.", "**D.** Connected Volumes affiche les hôtes, pas la répartition de la capacité."]]], "t": "Performance"}, {"n": 74, "q": "Alert 10036 - Excessive Pinned Space fires on a FlashArray. Which condition does this indicate?", "o": {"A": "Snapshots or other space-consumers are pinned and cannot be reclaimed, eating into usable capacity", "B": "NVRAM has run out of charge", "C": "FA File is over its export limit", "D": "ActiveCluster mediator is unreachable"}, "a": "A", "e": [["p", "Le pinned space est l’espace que la baie ne peut pas récupérer parce qu’il est retenu par des snapshots, des objets détruits mais non éradiqués ou d’autres consommateurs (par exemple des données protégées par SafeMode). L’alerte 10036 se déclenche lorsque cet espace épinglé devient assez important pour menacer la capacité."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** La charge de la NVRAM correspond à l’alerte 5056.", "**C.** Les exports FA File sont suivis séparément.", "**D.** Un médiateur injoignable se déclenche dans les alertes ActiveCluster, pas dans la 10036."]]], "t": "Performance"}, {"n": 75, "q": "A FlashArray is reporting high cache-aside (lookaside) usage during a workload. What does cache-aside generally indicate?", "o": {"A": "Front-end Ethernet ports are saturated", "B": "Reads are missing the inline path and being served from a side cache, possibly indicating skewed read patterns", "C": "NVRAM modules are about to fail", "D": "Replication links are down"}, "a": "B", "e": [["p", "Le schéma cache-aside (lookaside) correspond à une charge de travail dont les lectures contournent le chemin de données en ligne et sont servies depuis un cache annexe. Un usage lookaside élevé et durable indique une asymétrie des schémas de lecture ou des données chaudes ; Everpure le documente comme une opération backend pouvant affecter la latence."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** La saturation Ethernet apparaît dans les métriques de niveau lien, pas dans le cache-aside.", "**C.** Une défaillance de NVRAM se manifeste par l’alerte 5056 / des alertes matérielles, pas par des métriques cache-aside.", "**D.** Les problèmes de réplication apparaissent dans purearray connection list et dans les alertes de réplication."]]], "t": "Performance"}, {"n": 76, "q": "FA tools report excessive 'large I/O size requests' against a host that historically ran small block sizes. Which immediate effect is plausible per Pure documentation?", "o": {"A": "Snapshot deletion accelerates", "B": "Driver buffers are tied up longer per I/O, raising tail latency until the workload changes back", "C": "ActiveCluster mediator switches preferred array", "D": "FA File NFS exports auto-disable"}, "a": "B", "e": [["p", "D’après le document FlashArray Large I/O Size Requests and I/O Buffers (KB), les grosses E/S occupent les tampons du driver plus longtemps par commande, ce qui augmente la latence de queue (tail latency). La charge de travail n’est pas en cause : la baie met simplement plus de temps par requête que sa référence en petits blocs."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Le comportement de suppression des snapshots est indépendant.", "**C.** La baie préférée d’ActiveCluster est définie explicitement, pas selon la taille des E/S.", "**D.** Les exports FA File ne se désactivent pas automatiquement lors de rafales de grosses E/S."]]], "t": "Performance"}, {"n": 77, "q": "What is the recommended way for a Specialist to confirm the negotiated speed and SFP power of a Fibre Channel port on a FlashArray?", "o": {"A": "Read SFP statistics through the Purity//FA CLI / GUI port view", "B": "Run ethtool on the controller", "C": "Query the host BIOS", "D": "Check the AD domain controller"}, "a": "A", "e": [["p", "D’après l’objectif FASS sur le SAN, les statistiques SFP et les niveaux de puissance des ports FC se vérifient via la CLI ou les vues de ports de l’interface graphique de Purity//FA. Cela évite de s’appuyer sur des valeurs côté hôte ou côté commutateur pour valider un port de la baie."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** ethtool sert à l’Ethernet Linux, pas aux SFP des ports FC de la baie.", "**C.** Le BIOS de l’hôte ne voit pas les SFP de la baie.", "**D.** AD n’a aucun rôle dans les modules optiques des ports."]]], "t": "Performance"}, {"n": 78, "q": "An administrator is configuring NPIV on the SAN switch for a FlashArray fabric. Which Pure best practice should be followed?", "o": {"A": "Use NPIV-aware switch ports and follow Pure's NPIV Best Practices and Requirements guide", "B": "Disable NPIV on every switch port to reduce CPU load", "C": "Run NPIV traffic through the management VLAN", "D": "Use NPIV only for SafeMode traffic"}, "a": "A", "e": [["p", "Everpure publie un guide NPIV Best Practices and Requirements. NPIV est activé sur les ports du commutateur selon la spécification, afin que les hôtes virtualisés (par exemple des VM utilisant NPIV) présentent des WWN uniques que la baie peut zoner et identifier ; une mauvaise configuration provoque des login storms ou des initiateurs manquants."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Désactiver NPIV va à l’encontre de l’objectif des hôtes utilisant NPIV.", "**C.** Le trafic FC ne passe pas par un VLAN de gestion.", "**D.** NPIV n’a aucun rapport avec SafeMode."]]], "t": "Réseau"}, {"n": 79, "q": "Which transport protocol is described in Pure's NVMe-oF FAQ as supported on FlashArray for Ethernet-based NVMe access?", "o": {"A": "NVMe-TCP", "B": "NVMe-USB", "C": "NVMe-PoE", "D": "NVMe-WiFi"}, "a": "A", "e": [["p", "La FAQ NVMe-oF d’Everpure décrit NVMe-TCP comme le transport NVMe-over-Fabrics sur Ethernet pris en charge par FlashArray (à côté de NVMe-FC pour les fabrics Fibre Channel). NVMe-USB, NVMe-PoE et NVMe-WiFi ne sont pas de vrais transports."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** NVMe-USB n’est pas un transport défini.", "**C.** NVMe-PoE n’est pas un transport défini.", "**D.** NVMe-WiFi n’est pas un transport défini."]]], "t": "Réseau"}, {"n": 80, "q": "A Support Specialist is asked to validate phone-home connectivity from a non-Dark-Site FlashArray to Pure1. Which action is appropriate?", "o": {"A": "Use Purity//FA's phone-home/connectivity CLI to test reachability and inspect the last-success timestamp", "B": "Restart the array to force a phone-home retry", "C": "Disable the management interface to reset the session", "D": "Reseat NVRAM modules on both controllers"}, "a": "A", "e": [["p", "D’après l’objectif FASS Networking, les Specialists utilisent les commandes CLI de Purity//FA pour examiner les problèmes de phone-home et de connectivité, notamment pour vérifier l’accessibilité des points de terminaison Pure1 et lire l’heure du dernier contact réussi. Les actions disruptives comme les redémarrages ou la désactivation d’interfaces ne sont pas des premières étapes appropriées."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Un redémarrage est disruptif et n’est pas une étape de dépannage documentée pour le phone-home.", "**C.** Désactiver l’interface de gestion garantit l’échec du test.", "**D.** La NVRAM n’a rien à voir avec la connectivité du phone-home."]]], "t": "Réseau"}, {"n": 81, "q": "Pure FA File Auditing has been enabled. Where does Pure document the configuration checklist for setup?", "o": {"A": "FlashArray File Auditing Configuration Checklist KB", "B": "ActiveCluster FAQ", "C": "QoS FAQ", "D": "Snap To NFS FAQ"}, "a": "A", "e": [["p", "Everpure publie une KB « FlashArray File Auditing Configuration Checklist » comme référence pour activer et valider la journalisation d’audit sur FA File. Les documents ActiveCluster, QoS et Snap-To-NFS couvrent des sous-systèmes sans rapport."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** La FAQ ActiveCluster porte sur la réplication.", "**C.** La FAQ QoS porte sur les performances et la limitation de débit.", "**D.** La FAQ Snap To NFS traite du déport (offload), pas de l’audit."]]], "t": "Réseau"}, {"n": 82, "q": "A Pure FlashArray is approaching a Management/SSL certificate expiry. Which workflow is correct?", "o": {"A": "Generate a new CSR via purecert, sign it with the customer CA, import the signed cert, then remove the expired cert", "B": "Wait for the cert to expire and let Purity auto-rotate without action", "C": "Disable HTTPS on the management interface to avoid the warning", "D": "Replace the NVRAM modules"}, "a": "A", "e": [["p", "D’après la documentation d’Everpure sur la gestion des certificats, le workflow pris en charge est le suivant : générer une CSR avec purecert, la faire signer par l’autorité de certification du client, importer le certificat signé dans Purity, puis supprimer le certificat expiré. Une rotation automatique n’est pas présumée pour les certificats de gestion fournis par le client."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Il n’existe pas de renouvellement automatique pour les certificats gérés par le client.", "**C.** Désactiver HTTPS laisse le plan de gestion non chiffré.", "**D.** La NVRAM n’a aucun rapport avec les certificats."]]], "t": "Réseau"}, {"n": 83, "q": "Which interpretation matches a 'Latency Discrepancy in FlashArray GUI vs Pure1' KB scenario?", "o": {"A": "Different sample windows and aggregation methods can produce small numeric differences for the same workload", "B": "Pure1 always reports double the GUI latency", "C": "The GUI is wrong by definition during ActiveDR replication", "D": "Latency in the GUI reflects only writes, while Pure1 reflects only reads"}, "a": "A", "e": [["p", "Everpure documente que l’interface graphique de la FlashArray et Pure1 utilisent des intervalles d’échantillonnage et des méthodes d’agrégation différents ; les valeurs de latence peuvent donc différer légèrement pour une même période sans que cela signale un problème. Les Specialists doivent comparer des fenêtres équivalentes avant de chercher un écart."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Il n’existe aucun rapport fixe de 2x entre les deux.", "**C.** L’interface graphique n’est pas fausse par définition pendant ActiveDR.", "**D.** Les deux vues agrègent la latence en lecture et en écriture."]]], "t": "Performance"}, {"n": 84, "q": "Which CLI prints the 'fa support tools' index that lists the available 'fa' diagnostics on a FlashArray?", "o": {"A": "fa list", "B": "fa help / fa --help", "C": "purehw list --tools", "D": "purearray help --tools"}, "a": "B", "e": [["p", "fa avec --help (ou fa help) affiche l’index des outils de support « fa » disponibles, notamment les commandes dump, timeline, space et de diagnostic. La KB d’Everpure « Listing All the Available fa Support Tools » documente ce point d’entrée."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** fa list n’est pas le point d’entrée d’aide documenté.", "**C.** purehw list --tools n’est pas une vraie option.", "**D.** purearray help --tools n’est pas une vraie option."]]], "t": "Performance"}, {"n": 85, "q": "A FlashArray Support Specialist is performing a self-service Purity//FA upgrade through Edge Management Service (EMS). Which check is mandatory before kicking off the upgrade?", "o": {"A": "Verify all NVRAM modules report fully charged and no degraded write groups exist", "B": "Disable SafeMode on every protection group", "C": "Reset every host's iSCSI sessions", "D": "Power-cycle each DirectFlash shelf"}, "a": "A", "e": [["p", "Les recommandations Purity Upgrades d’Everpure et l’alerte 5056 exigent une NVRAM entièrement chargée et un write group sain avant une mise à niveau. Le workflow EMS Self-Service Upgrade exécute le script de mise à niveau qui valide ces conditions ; l’échec d’un contrôle bloque la mise à niveau."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Désactiver SafeMode n’est pas sûr et n’est pas un prérequis.", "**C.** Réinitialiser les sessions iSCSI des hôtes est disruptif et inutile.", "**D.** Mettre les tiroirs hors tension puis sous tension est une étape destructive, pas un contrôle préalable à la mise à niveau."]]], "t": "Logiciel"}, {"n": 86, "q": "Which Pure construct is described in 'Pure Fusion Requirements and Recommendations' for managing storage as a fleet?", "o": {"A": "A single-array protection group", "B": "A multi-array fleet coordinated by a fleet coordinator with shared identity and policy", "C": "A standalone CloudSnap target", "D": "A SafeMode-protected snapshot"}, "a": "B", "e": [["p", "Everpure Fusion (V2) coordonne plusieurs FlashArray en tant que flotte (fleet) grâce à un coordinateur de flotte, en partageant l’identité, les certificats et les politiques. C’est ce qui permet les opérations à l’échelle de la flotte (et ce qui crée la période de grâce de 45 jours pour les certificats lorsque le coordinateur est hors ligne)."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Les groupes de protection sont propres à une baie ; ce n’est pas une construction de flotte.", "**C.** CloudSnap relève du déport, pas de la gestion de flotte.", "**D.** SafeMode protège les snapshots ; il ne coordonne pas une flotte."]]], "t": "Logiciel"}, {"n": 87, "q": "An ActiveCluster Purity upgrade is being scheduled. Which best practice does Pure document to keep the cluster online?", "o": {"A": "Upgrade both arrays at exactly the same time", "B": "Upgrade one array at a time, observing ActiveCluster health and connectivity between upgrades", "C": "Disable the mediator before starting", "D": "Demote all pods on both arrays before starting"}, "a": "B", "e": [["p", "La KB d’Everpure ActiveCluster Purity Upgrade Scheduling recommande explicitement de mettre à niveau une baie à la fois, en vérifiant la santé d’ActiveCluster et la connectivité avec le médiateur avant de passer à la suivante. Des mises à niveau simultanées brisent la conception actif/actif, et rétrograder les pods n’est pas nécessaire."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**A.** Des mises à niveau simultanées provoquent une interruption.", "**C.** Désactiver le médiateur supprime la protection contre le split-brain pendant la fenêtre de mise à niveau.", "**D.** Rétrograder tous les pods est disruptif et inutile."]]], "t": "Réplication"}, {"n": 88, "q": "Which statement best describes 'ActiveWorkload' in the context of ActiveCluster?", "o": {"A": "A feature that non-disruptively migrates workloads between FlashArray systems by stretching volumes in a pod and spoofing multipath with volume serial numbers", "B": "The cloud-only mediator service that arbitrates split-brain", "C": "A snapshot offload product that replaces CloudSnap", "D": "A separate replication product that supersedes ActiveCluster synchronous mirroring"}, "a": "A", "e": [["p", "D’après la documentation ActiveWorkload d’Everpure et les objectifs FASS sur la réplication, ActiveWorkload s’appuie sur la technologie synchrone d’ActiveCluster pour déplacer les charges de travail sans interruption entre des systèmes FlashArray. Les volumes sont placés dans un pod et étendus (stretched) vers une baie cible, et les hôtes continuent leurs E/S grâce à l’usurpation des numéros de série dans le multipath, sans l’arrêt de reconfiguration propre aux déplacements manuels de volumes."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Le médiateur cloud arbitre les partitions ActiveCluster ; ce n’est pas ActiveWorkload.", "**C.** Le déport de snapshots, c’est CloudSnap, pas ActiveWorkload.", "**D.** ActiveWorkload utilise la technologie ActiveCluster ; il ne remplace pas ActiveCluster synchrone."]]], "t": "Réplication"}, {"n": 89, "q": "A FlashArray Support Specialist needs to verify the IPv6 management address is properly bound on a controller's management interface. Which approach is correct?", "o": {"A": "Use Purity//FA's network-listing CLI to view IPv4/IPv6 addresses on each interface and confirm operational state", "B": "Run dig +trace on a remote DNS server", "C": "Read /proc/net/dev on the controller via SSH", "D": "Look at Pure1 to derive the IPv6 address"}, "a": "A", "e": [["p", "Purity//FA expose les détails IPv4/IPv6 par interface via sa CLI de liste réseau, ce qui est la méthode prise en charge pour qu’un Specialist confirme l’association de l’adresse et l’état opérationnel. L’accès direct au shell du contrôleur n’est pas la voie documentée."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Un dig +trace ne dit rien sur le fait que l’adresse soit associée au contrôleur.", "**C.** Inspecter directement /proc n’est pas le workflow pris en charge.", "**D.** Pure1 reflète de la télémétrie, mais ce n’est pas l’endroit pour valider l’association d’une interface."]]], "t": "Réseau"}, {"n": 90, "q": "Which CLI workflow checks DNS resolution on a FlashArray itself when SMB clients claim DNS is broken?", "o": {"A": "Use Purity//FA's CLI to run a name-lookup diagnostic against configured resolvers", "B": "Reseat the management NIC", "C": "Reboot CT0", "D": "Disable iSCSI"}, "a": "A", "e": [["p", "D’après l’objectif FASS Networking sur le DNS, les Specialists évaluent le fonctionnement du DNS depuis la baie avec les utilitaires CLI réseau/dns de Purity//FA (ainsi que des ping et recherches auprès des résolveurs configurés) avant d’incriminer les clients. Réenficher, redémarrer ou désactiver des protocoles est disruptif et inutile."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Réenficher une carte réseau est destructeur et inutile.", "**C.** Redémarrer les contrôleurs n’est pas un diagnostic de première intention.", "**D.** Désactiver iSCSI n’apporte rien pour le DNS."]]], "t": "Réseau"}, {"n": 91, "q": "A SafeMode-protected snapshot needs to be restored after a ransomware event has compromised admin credentials. What is the correct first step?", "o": {"A": "Open a Pure Support case to authenticate the customer and unlock the SafeMode-protected restore", "B": "Eradicate all destroyed snapshots first to free space", "C": "Disable LDAP and SAML auth", "D": "Promote a new ActiveCluster preferred array"}, "a": "A", "e": [["p", "Par conception, SafeMode exige l’intervention du support Everpure pour récupérer des snapshots protégées après une compromission d’identifiants. Le cas authentifie le client par les ement ce chemin de dépannage dans les KB Slow Drain et CTIO Timeout."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Une défaillance de NVRAM affecterait les écritures de toute la baie, pas un commutateur précis.", "**C.** Une panne de télémétrie Pure1 n’a pas d’impact sur le FC du chemin de données.", "**D.** Les problèmes de certificat ne déclenchent pas de CTIO timeouts."]]], "t": "Performance"}, {"n": 94, "q": "Which artifact does Pure recommend uploading on every Pure Support case for a FlashArray?", "o": {"A": "A current support log bundle generated via the documented pureconfig / fa dump bundle workflow", "B": "Only the GUI screenshot of the alert", "C": "The customer's ITSM ticket export", "D": "A photo of the rack"}, "a": "A", "e": [["p", "Le support Everpure s’appuie sur le lot de support de référence (sortie pureconfig / fa dump bundle) pour reconstituer l’état de la baie, rechercher des correspondances avec des problèmes connus et accélérer l’analyse de cause racine. Les captures d’écran aident, mais le lot est indispensable."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Une capture d’écran seule ne suffit pas à un diagnostic complet.", "**C.** Les exports ITSM ne contiennent pas l’état de la baie.", "**D.** Les photos ont rarement une valeur de diagnostic."]]], "t": "Matériel"}, {"n": 95, "q": "A FlashArray Support Specialist sees a Remote Assist session enabled. Per Pure best practice and the FASS health-check objective, which check is most relevant?", "o": {"A": "Confirm the session has an explicit expiration and was opened by an Array Admin", "B": "Verify SafeMode has been disabled to allow Remote Assist", "C": "Disable LDAP for the duration of the session", "D": "Eradicate all destroyed snapshots"}, "a": "A", "e": [["p", "D’après l’objectif FASS de contrôle de santé (health-check), les Specialists confirment les paramètres et les règles d’expiration d’une session Remote Assist, et s’assurent qu’elle a été activée par un Array Admin (un Storage Admin ne peut pas l’activer). Cela maintient des fenêtres de session courtes et auditables."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** SafeMode ne bloque pas Remote Assist ; ce lien est inventé.", "**C.** Désactiver LDAP n’a aucun rapport et est disruptif.", "**D.** L’éradication est destructrice et sans rapport."]]], "t": "Logiciel"}, {"n": 96, "q": "Which Purity//FA construct is required to wide-stripe a write group across more drives than a default configuration allows?", "o": {"A": "Wide Write Groups (enabled per Pure documentation: 'What You Need to Enable Wide Write Groups')", "B": "Wide SafeMode Pool", "C": "Wide ActiveCluster", "D": "Wide CloudSnap"}, "a": "A", "e": [["p", "Everpure publie une KB « What You Need to Enable Wide Write Groups ». Les Wide Write Groups répartissent les écritures sur un plus grand nombre de disques que la configuration par défaut, ce qui améliore la reconstruction et le parallélisme d’écriture sur les plateformes appropriées. Les autres options ne sont pas de vraies constructions."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Il n’existe pas de produit « Wide SafeMode Pool ».", "**C.** Il n’existe pas de produit « Wide ActiveCluster ».", "**D.** Il n’existe pas de produit « Wide CloudSnap »."]]], "t": "Logiciel"}, {"n": 97, "q": "Which subsystem does Pure's 'FMM (Flash Memory Manager) TuneUp Troubleshooting' KB cover?", "o": {"A": "Internal flash-memory management on FlashArray (garbage collection, wear leveling, tuning)", "B": "Front-end FC port tuning", "C": "FA File NFS share auditing", "D": "ActiveCluster mediator selection"}, "a": "A", "e": [["p", "FMM est le Flash Memory Manager de Purity//FA : le sous-système qui exécute le garbage collection, le wear leveling et d’autres tâches internes de gestion de la flash. Les KB FMM TuneUp documentent les conditions dans lesquelles Everpure peut ajuster des paramètres FMM pour traiter un problème de performance."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Le réglage des ports FC est un autre sous-système.", "**C.** L’audit NFS de FA File est indépendant.", "**D.** La sélection du médiateur ActiveCluster relève de la réplication."]]], "t": "Logiciel"}, {"n": 98, "q": "A 'host personality mismatch' alert appears against an ESXi host on a FlashArray. Which root cause matches Pure's documentation?", "o": {"A": "The host object's personality (e.g., ESXi) does not match the actual host OS, causing suboptimal SCSI/NVMe behavior", "B": "NVRAM has lost charge", "C": "DNS lookup failed", "D": "ActiveCluster mediator is unreachable"}, "a": "A", "e": [["p", "Chaque objet hôte de Purity//FA porte une personnalité (personality), par exemple ESXi, AIX ou Solaris. Lorsque la personnalité configurée ne correspond pas au système d’exploitation réel, les particularités SCSI/NVMe et le comportement des réservations sont erronés, ce qui peut causer des problèmes multipath subtils. La correction consiste à définir la bonne personnalité avec purehost."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** La NVRAM n’a aucun rapport avec la personnalité d’un hôte.", "**C.** Les recherches DNS ne déclenchent pas d’alertes de personnalité.", "**D.** L’état du médiateur n’a aucun rapport."]]], "t": "Logiciel"}, {"n": 99, "q": "Which Pure document covers transitioning from SnapToNFS to CloudSnap, and what is the practical motivation?", "o": {"A": "'SnapToNFS transition to CloudSnap' KB; CloudSnap is the documented forward path replacing SnapToNFS for snapshot offload", "B": "ActiveCluster FAQ; ActiveCluster replaces SnapToNFS", "C": "Purity Upgrades; the upgrade itself replaces SnapToNFS automatically", "D": "QoS FAQ; QoS replaces SnapToNFS"}, "a": "A", "e": [["p", "La KB d’Everpure « SnapToNFS transition to CloudSnap » détaille les étapes opérationnelles pour migrer de l’ancien déport SnapToNFS vers CloudSnap, qui est le chemin de déport de snapshots pris en charge pour l’avenir."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** ActiveCluster est une réplication synchrone, pas un déport de snapshots.", "**C.** Les mises à niveau ne migrent pas silencieusement les cibles de déport.", "**D.** La QoS est une fonction de performance, pas un remplaçant de SnapToNFS."]]], "t": "Performance"}, {"n": 100, "q": "Putting it together: a customer reports a sudden spike in write latency on one ESXi cluster, while other hosts on the same FlashArray are healthy. Which troubleshooting sequence aligns best with the FASS Performance domain?", "o": {"A": "Check Pure1 / GUI per-host latency and bandwidth top-talkers, look at driver-stall stages (alloc_done_to_exec) for SAN-side latency, verify ESXi PSP=RR with IOPS=1, then evaluate whether QoS limits or noisy-neighbor explain the spike", "B": "Immediately reseat NVRAM modules on both controllers", "C": "Disable SafeMode and eradicate snapshots to reclaim space", "D": "Reboot the ActiveCluster mediator"}, "a": "A", "e": [["p", "La séquence conforme aux pratiques d’Everpure est la suivante : identifier l’hôte fautif via les top-talkers de Pure1/de l’interface graphique, examiner les étapes de driver stall (un alloc_done_to_exec élevé oriente vers des problèmes côté SAN / hôte), vérifier les bonnes pratiques VMware (PSP_RR avec IOPS=1), puis utiliser la QoS ou le zoning pour contenir les voisins bruyants. Les actions matérielles disruptives ne sont pas du dépannage de première intention."], ["p", "**Pourquoi les autres réponses sont fausses :**"], ["ul", ["**B.** Réenficher la NVRAM est destructeur et sans rapport avec un pic de latence sur un seul hôte.", "**C.** Désactiver SafeMode et éradiquer des snapshots est une action irréversible sans valeur de diagnostic.", "**D.** Redémarrer le médiateur ne change pas la latence d’écriture de l’hôte."]]], "t": "Performance"}];      // n, q = énoncé, o = options, a = bonne réponse, e = explication (blocs), t = thème, x = description d'exhibit

const INTRO = [{"t": "Description de la certification", "b": [["p", "La certification **Everpure Certified FlashArray Support Specialist (FASS)** valide des compétences de support de niveau root sur Everpure FlashArray. L’examen s’adresse aux Support Specialists Everpure internes, aux Support Specialists partenaires et aux clients Dark Site disposant d’un accès root. Il évalue la validation de l’état du matériel (purearray, purehw, pureservice), les opérations logicielles de Purity//FA 6.9.x (volumes, groupes de protection, snapshots, hôtes, groupes d’hôtes, SafeMode, write groups, Everpure Fusion), le réseau (FC, iSCSI, NVMe-TCP, FA File, certificats), le dépannage des performances (étapes de driver stall, slow drain, CTIO timeouts, QoS, system space) et la réplication (asynchrone via CONNECTION, ActiveCluster, ActiveDR, CloudSnap)."]]}, {"t": "Nature de ce simulateur", "b": [["p", "Ce QCM est un simulateur de questions destiné à l’entraînement en vue du passage de la certification. Il ne reproduit pas les questions de l’examen réel : elles ne sont ni issues d’anciens examens ni fournies par les organismes d’examen. Il s’appuie en revanche sur des ressources d’étude, sur les programmes d’examen et sur les informations thématiques accessibles au public. La couverture, le format et le niveau de difficulté peuvent donc différer de ceux de l’examen réel."], ["p", "Ce QCM est aussi un véritable outil d’apprentissage : les explications de chaque question, la révision espacée et les flashcards permettent d’approfondir les notions et de consolider ses connaissances avant l’examen, puis de les éprouver en conditions réelles."], ["p", "**Les domaines couverts par cette certification :**"], ["grille", ["Mémoriser le rôle de chaque CLI de premier niveau : purearray (identité de la baie et connexions distantes), purehw (composants physiques), pureservice (services), puredb (diagnostics de bas niveau), purevol/pureprotectiongroup/puresnap (services de données), purehost/purehgroup (connectivité), purenetwork (interfaces), purecert (certificats).", "S’exercer à lire les étapes de driver stall dans core.log : un alloc_done_to_exec élevé indique une latence côté SAN ou côté hôte (l’hôte remplit lentement le tampon), et non le temps de service de la baie.", "Connaître les numéros d’alertes : Alerte 51 (Protection Group Replication Delayed), Alerte 73 (Chassis Manager Mastership Failure), Alerte 5002 (CTIO Timeout), Alerte 5056 (NVRAM Undercharged), Alerte 10036 (Excessive Pinned Space).", "Mémoriser le budget de RTT d’ActiveCluster (11 ms maximum) et le rôle du médiateur et de la baie préférée ; se rappeler que le médiateur cloud ne répond PAS à l’ICMP : des pings en échec ne constituent pas le diagnostic.", "Retenir le détail d’Everpure Fusion V2 : lorsque le coordinateur de flotte est hors ligne, la rotation des certificats est retardée, mais les certificats existants restent valides pendant une période de grâce de 45 jours.", "S’exercer aux bonnes pratiques côté hôte : ESXi utilise VMW_PSP_RR avec IOPS=1 ; les VLAN de stockage iSCSI/NVMe-TCP utilisent une MTU de 9000 de bout en bout ; un slow drain FC sur un seul commutateur de bordure est un schéma classique de CTIO timeout."]]]}];          // sections de présentation (À propos)

function charger(){
  try{

    if(s && s.rep && s.verif){ const r = Object.assign(ETAT_INITIAL(), s);
      if(!Object.keys(r.sr).length) Object.keys(r.verif).forEach(i => { const ok = r.rep[i]===QUESTIONS[i].a; r.sr[i] = {box:ok?2:1, ok:+ok, ko:+!ok, due:Date.now()+(ok?864e5:0)}; });
      return r; }
  }catch(e){}
  return ETAT_INITIAL();
}

const $app = document.getElementById('app');
const N = QUESTIONS.length;

/* Création d'élément concise (le texte est toujours inséré via textContent : aucun risque d'injection) */
function el(tag, attrs={}, ...enfants){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') n.className = v;
    else if(k==='text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) n.setAttribute(k, v);
  }
  enfants.flat().filter(c => c != null && c !== false).forEach(c => n.append(c));  // ignore les enfants vides
  return n;
}
/* ============================================================
   TEXTE ENRICHI : **gras**, *italique*, `code` (construit via le DOM, sans innerHTML)
   ============================================================ */
function inline(txt){
  const f = document.createDocumentFragment();
  String(txt).split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*\s][^*]*\*)/).forEach(s => {
    if(!s) return;
    if(s.startsWith('**')) f.append(el('strong',{text:s.slice(2,-2)}));
    else if(s[0]==='`') f.append(el('code',{text:s.slice(1,-1)}));
    else if(s[0]==='*') f.append(el('em',{text:s.slice(1,-1)}));
    else f.append(s);
  });
  return f;
}
const bloc = b => b[0]==='grille' ? el('div',{class:'domaines'}, b[1].map((x,k) => el('div',{class:'dom'}, el('span',{class:'dom-num','aria-hidden':'true',text:String(k+1)}), el('p',{}, inline(x))))) : (b[0]==='ul' || b[0]==='ol') ? el(b[0],{}, b[1].map(x => el('li',{}, inline(x)))) : el('p',{}, inline(b[1]));

function blocExhibit(q){

    el('details',{}, el('summary',{text:'Description textuelle de l’exhibit'}), el('p',{}, inline(q.x))));
}

function ouvrirZoom(src, alt){
  let s = 1, x = 0, y = 0, deplace = false; const pts = new Map(); let d0 = 0, s0 = 1;
  const retour = document.activeElement;
  const img = el('img',{src, alt, draggable:'false'});
  const scene = el('div',{class:'zoom-scene'}, img);
  const lbl = el('span');
  const maj = () => { img.style.transform = `translate(${x}px,${y}px) scale(${s})`; lbl.textContent = Math.round(s*100) + ' %'; };
  const zoomer = (f, cx, cy) => {                       // zoom centré sur (cx,cy), en pixels écran
    const r = scene.getBoundingClientRect();
    const px = (cx ?? r.left + r.width/2) - r.left - r.width/2, py = (cy ?? r.top + r.height/2) - r.top - r.height/2;
    const ns = Math.min(10, Math.max(.3, s*f)), k = ns/s;
    x = px - (px-x)*k; y = py - (py-y)*k; s = ns; maj();
  };
  const reset = () => { s = 1; x = 0; y = 0; maj(); };
  const fermer = () => { document.removeEventListener('keydown', touche, true); ov.remove(); document.body.style.overflow = ''; retour?.focus?.(); };
  const touche = e => {
    if(e.key==='Escape') fermer(); else if(e.key==='+'||e.key==='=') zoomer(1.25); else if(e.key==='-') zoomer(.8); else if(e.key==='0') reset(); else return;
    e.preventDefault(); e.stopPropagation();
  };
  const btnFermer = el('button',{onclick:fermer,'aria-label':'Fermer',text:'✕ Fermer'});
  const ov = el('div',{class:'zoom',role:'dialog','aria-modal':'true','aria-label':'Exhibit agrandi'},
    el('div',{class:'zoom-barre'},
      el('button',{onclick:()=>zoomer(.8),'aria-label':'Dézoomer',text:'−'}), lbl,
      el('button',{onclick:()=>zoomer(1.25),'aria-label':'Zoomer',text:'+'}),
      el('button',{onclick:reset,text:'Ajuster'}), btnFermer,
      el('small',{style:'flex-basis:100%;text-align:center;color:#aaa',text:'Molette ou pincer pour zoomer · glisser pour déplacer · double-clic pour agrandir · Échap pour fermer'})),
    scene);
  scene.addEventListener('wheel', e => { e.preventDefault(); zoomer(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY); }, {passive:false});
  scene.addEventListener('dblclick', e => { if(s > 1.05) reset(); else zoomer(2.5, e.clientX, e.clientY); });
  scene.addEventListener('pointerdown', e => { scene.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); deplace = false;
    if(pts.size===2){ const [a,b] = [...pts.values()]; d0 = Math.hypot(a.x-b.x, a.y-b.y); s0 = s; } });
  scene.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    if(pts.size===1){ x += e.clientX-p.x; y += e.clientY-p.y; if(Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y) > 2) deplace = true; maj(); }
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b] = [...pts.values()]; zoomer(s0*Math.hypot(a.x-b.x,a.y-b.y)/d0/s, (a.x+b.x)/2, (a.y+b.y)/2); deplace = true; }
  });
  const fin = e => { pts.delete(e.pointerId); if(e.type==='pointerup' && e.target===scene && !deplace && pts.size===0) fermer(); };
  scene.addEventListener('pointerup', fin); scene.addEventListener('pointercancel', fin);
  document.body.append(ov); document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', touche, true);
  maj(); btnFermer.focus();
}

/* ============================================================
   PROTECTIONS ANTI-REPRODUCTION (dissuasives : aucun moyen n'empêche totalement la copie d'une page web)
   true / false pour activer ou désactiver chaque mesure
   ============================================================ */
const PROTECTION = {
  antiCopie: true,    // pas de sélection / copier / glisser-déposer / menu contextuel sur le contenu
  impression: false   // false = l'impression (Ctrl+P / PDF) n'affiche qu'un message
};
function activerProtections(){
  const b = document.body;
  b.classList.toggle('sans-impression', !PROTECTION.impression);
  b.classList.toggle('anti-copie', PROTECTION.antiCopie);

/* ============================================================
   FILTRES : statut (toutes, non vérifiées, erreurs, marquées) ou thème ; la navigation suit la sélection
   ============================================================ */
function liste(f = etat.filtre || 'tous'){
  const th = f.startsWith('th:') ? f.slice(3) : null;
  return QUESTIONS.map((_,i)=>i).filter(i => f==='tous' || (f==='nonrep' && !etat.verif[i]) || (f==='erreurs' && etat.verif[i] && !estJuste(i))
    || (f==='marquees' && etat.flags[i]) || (f==='dues' && etat.sr[i] && etat.sr[i].due<=Date.now()) || (th && QUESTIONS[i].t===th));
}
const ordreNav = () => { const l = liste(); return l.length ? l : QUESTIONS.map((_,i)=>i); };
function voisin(i, d){ const l = ordreNav(), p = l.indexOf(i); if(p<0) return Math.max(0, Math.min(N-1, i+d)); return l[p+d] ?? null; }
function filtresUI(){
  const rangee = (titre, defs) => el('div',{class:'chips'}, el('small',{text:titre}), defs.map(([f,lib]) => {
    const n = liste(f).length;
    return el('button',{class:`chip ${etat.filtre===f?'actif':''} ${n?'':'vide'}`,'aria-pressed':String(etat.filtre===f),text:`${lib} (${n})`,
      onclick:()=>{ etat.filtre = (etat.filtre===f && f!=='tous') ? 'tous' : f; sauver(); rendre(); }});
  }));
  return el('div',{class:'filtres'},
    rangee('Statut', [['tous','Toutes'],['nonrep','Non vérifiées'],['erreurs','Mes erreurs'],['marquees','🚩 Marquées'],['dues','🔁 À réviser']]),
    rangee('Thème', THEMES.map(t => ['th:'+t, t])));
}

function confirmer(message, oui = 'Confirmer'){

    const retour = document.activeElement;
    const fin = v => { ov.remove(); retour && retour.focus && retour.focus(); res(v); };

    const ov = el('div',{class:'modale',role:'alertdialog','aria-modal':'true','aria-label':'Confirmation',onkeydown:e=>{ if(e.key==='Escape') fin(false); }},
      el('div',{class:'modale-corps'}, el('p',{text:message}), el('div',{class:'rangee'}, btnOui, el('button',{class:'btn',onclick:()=>fin(false),text:'Annuler'}))));
    document.body.append(ov); btnOui.focus();
  });
}

const examActif = () => !!(etat.exam && !etat.exam.termine);

const pad = n => String(n).padStart(2,'0');
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; };

function majEntete(){
  const pastille = document.getElementById('scoreLive'), barre = document.getElementById('barreGlobale');

function vueQuestion(){
  const i = etat.cur, q = QUESTIONS[i], verifiee = !!etat.verif[i];
  const choix = etat.rep[i] || null;

  /* Options : cases à cocher, une seule sélection possible */
  const champ = el('fieldset',{class:'options'}, el('legend',{class:'sr',style:'position:absolute;left:-9999px',text:`Options de la question ${q.n}`}));
  Object.entries(q.o).forEach(([lettre,texte])=>{
    let cls = 'option';
    if(verifiee){
      cls += ' verrou';
      if(lettre===q.a) cls += ' bonne';
      else if(lettre===choix) cls += ' mauvaise';
    } else if(lettre===choix) cls += ' choisie';

    const cb = el('input',{type:'checkbox',name:`q${q.n}`,value:lettre,checked:lettre===choix?'':false,disabled:verifiee?'':false});
    cb.checked = lettre===choix;
    cb.addEventListener('change',()=>{
      etat.rep[i] = cb.checked ? lettre : undefined;       // décocher = effacer la sélection
      if(!cb.checked) delete etat.rep[i];
      sauver(); rendre();
    });
    const badge = verifiee && lettre===q.a ? el('span',{class:'badge',text:'Bonne réponse'})
                : verifiee && lettre===choix ? el('span',{class:'badge',text:'Votre réponse'}) : null;
    champ.append(el('label',{class:cls}, cb, el('span',{class:'lettre',text:lettre+'.'}), el('span',{class:'texte-opt'}, inline(texte)), badge));
  });

  const fb = el('div',{class:'feedback','aria-live':'polite'}, el('div',{}, verifiee ? blocFeedback(i) : ''));
  if(verifiee) fb.classList.add('ouvert');

  const L = ordreNav(), p = Math.max(0, L.indexOf(i)), prev = voisin(i,-1), next = voisin(i,1), dernier = next===null;
  const btnVerifier = el('button',{class:'btn primaire',disabled:(!choix||verifiee)?'':false,text:'Vérifier la réponse',
    onclick:()=>{
      if(!choix || etat.verif[i]) return;
      etat.verif[i] = true; srMaj(i, choix===q.a); sauver(); majEntete();
      fb.firstChild.replaceChildren(blocFeedback(i));
      /* Mise en couleur des options sans reconstruire la page, pour garder l'animation */
      champ.querySelectorAll('.option').forEach(l=>{
        const v = l.querySelector('input').value;
        l.classList.remove('choisie'); l.classList.add('verrou');
        l.querySelector('input').disabled = true;
        if(v===q.a){ l.classList.add('bonne'); l.append(el('span',{class:'badge',text:'Bonne réponse'})); }
        else if(v===choix){ l.classList.add('mauvaise'); l.append(el('span',{class:'badge',text:'Votre réponse'})); }
      });
      btnVerifier.disabled = true;
      requestAnimationFrame(()=>requestAnimationFrame(()=>fb.classList.add('ouvert')));
      setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
    }});

  return el('section',{class:'carte'},
    el('div',{class:'haut-q'},
      el('span',{class:'num-q',text: etat.filtre==='tous' ? `Question ${q.n} sur ${N}` : `Question ${q.n} · ${p+1}/${L.length} de la sélection`}),
      el('div',{class:'rangee'}, boutonFlag(etat.flags, i), el('button',{class:'lien',onclick:()=>aller('sommaire'),text:'Retour au sommaire'}))
    ),
    el('div',{class:'mini-barre'}, el('div',{style:`width:${(p+1)/L.length*100}%`})),
    el('h2',{class:'enonce'}, inline(q.q)),
    blocExhibit(q),
    champ,
    fb,
    el('div',{class:'nav-q'},
      el('button',{class:'btn fleche',disabled:prev===null?'':false,'aria-label':'Question précédente',title:'Précédente (←)',onclick:()=>aller('question',prev),text:'←'}),
      el('div',{class:'nav-centre'},
        btnVerifier,
        dernier ? el('button',{class:'btn',onclick:()=>aller('resume'),text:'Terminer'}) : null
      ),
      el('button',{class:'btn fleche',disabled:dernier?'':false,'aria-label':'Question suivante',title:'Suivante (→)',onclick:()=>aller('question',next),text:'→'})
    )
  );
}

   ============================================================ */
const vers = v => { etat.vue = v; sauver(); rendre(); window.scrollTo({top:0}); };
function allerExam(vue, pos){
  etat.vue = vue;
  if(pos!==undefined) etat.exam.pos = Math.max(0, Math.min(NX()-1, pos));
  sauver(); rendre(); window.scrollTo({top:0});
}

function demarrerExamen(){
  const ordre = QUESTIONS.map((_,i)=>i);
  for(let k=ordre.length-1;k>0;k--){ const r = Math.floor(Math.random()*(k+1)); [ordre[k],ordre[r]] = [ordre[r],ordre[k]]; }  ordre.length = Math.min(NB_EXAMEN, N);   // tirage aléatoire différent à chaque passage
  const now = Date.now();
  etat.exam = { ordre, pos:0, rep:{}, flags:{}, debut:now, fin:now+DUREE_EXAMEN, termine:null, auto:false };
  allerExam('examQ', 0);
}

function terminerExamen(auto){
  if(!examActif()) return;
  etat.exam.termine = Math.min(Date.now(), etat.exam.fin);
  etat.exam.auto = !!auto; etat.exam.ordre.forEach(i => { if(etat.exam.rep[i]) srMaj(i, etat.exam.rep[i]===QUESTIONS[i].a); });
  etat.vue = 'examRes'; sauver(); rendre(); window.scrollTo({top:0});
}

/* Chronomètre : vérifié chaque seconde ; l'examen est rendu automatiquement à 0:00:00 */
function tick(){
  if(!examActif()) return;
  if(etat.exam.fin - Date.now() <= 0){ terminerExamen(true); return; }
  if(etat.vue==='examQ' || etat.vue==='examRevue') majEntete();
}

function Page(w = 595.28, h = 841.89){

    rect(x, y, ww, hh, fill, stroke, lw = 1){ ops.push(`${fill ? rgb(fill)+' rg ' : ''}${stroke ? rgb(stroke)+' RG '+lw+' w ' : ''}${x} ${Y(y+hh)} ${ww} ${hh} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`); return P; },

  o[2] = S(`<</Type/Pages/Count ${n}/Kids[${pages.map((_,i) => (10+2*i)+' 0 R').join(' ')}]>>`);
  ['Helvetica','Helvetica-Bold','Times-Bold','Times-Italic'].forEach((f,i) => o[3+i] = S(`<</Type/Font/Subtype/Type1/BaseFont/${f}/Encoding/WinAnsiEncoding>>`));
  o[7] = flux(`/Type/XObject/Subtype/Image/Width ${logo.w}/Height ${logo.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/SMask 8 0 R${logo.z?'/Filter/FlateDecode':''}`, logo.rgb);
  o[8] = flux(`/Type/XObject/Subtype/Image/Width ${logo.w}/Height ${logo.h}/ColorSpace/DeviceGray/BitsPerComponent 8${logo.z?'/Filter/FlateDecode':''}`, logo.a);
  const res = '/Resources<</Font<</H 3 0 R/HB 4 0 R/TB 5 0 R/TI 6 0 R>>/XObject<</Im1 7 0 R>>>>';
  pages.forEach((p,i) => { o[9+2*i] = flux('', S(p.ops.join('\n'))); o[10+2*i] = S(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${p.w} ${p.h}]${res}/Contents ${9+2*i} 0 R>>`); });
  const parts = [S('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')], off = []; let len = parts[0].length;
  for(let i = 1; i < o.length; i++){ off[i] = len; const b = cat([S(`${i} 0 obj\n`), o[i], S('\nendobj\n')]); parts.push(b); len += b.length; }
  let x = `xref\n0 ${o.length}\n0000000000 65535 f \n`; for(let i = 1; i < o.length; i++) x += String(off[i]).padStart(10,'0') + ' 00000 n \n';
  parts.push(S(x + `trailer\n<</Size ${o.length}/Root 1 0 R/Info<</Title ${pdfStr(titre)}/Author ${pdfStr('Mohamed BARR')}>>>>\nstartxref\n${len}\n%%EOF`));
  return cat(parts);
}

    Promise.all([z(col), z(a)]).then(([zc, za]) => res(zc && za ? {w:c.width, h:c.height, rgb:zc, a:za, z:true} : {w:c.width, h:c.height, rgb:col, a})); };

async function partager(txt){
  const url = location.href.split('#')[0];
  if(!/^https?:/.test(location.protocol)) return info('Cette copie est ouverte en local : publiez-la (lien claude.ai, GitHub Pages, Netlify…) pour obtenir un lien à partager.');
  try{ if(navigator.share) return await navigator.share({title:document.title, text:txt||'QCM FASS Everpure', url}); }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(url); info('Lien copié dans le presse-papiers.'); }catch(e){ info(url); }
}
